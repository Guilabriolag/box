<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tamagotchi Aquário — protótipo</title>
<style>
:root{
 --sky1:#bdeaff; --sky2:#eaf9ff; --water1:#8fe3ff; --water2:#2f9fd6;
 --ink:#3a3358; --card:rgba(255,255,255,.86); --shell:#f4eee2; --shell2:#e4dcc9;
 --accent:#ff9ecf; --accent2:#7fd8ff; --warn:#ff8f5a; --bad:#ff6f6f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:#d7cdb4;font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;
 overflow:hidden;color:var(--ink);display:flex;align-items:center;justify-content:center}

/* ---- corpo do "aparelho" tamagotchi ---- */
#device{position:relative;width:min(420px,94vw);height:min(860px,96dvh);background:linear-gradient(160deg,var(--shell),var(--shell2));
 border-radius:46px;box-shadow:0 20px 40px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.6);
 padding:22px 18px 26px;display:flex;flex-direction:column;align-items:center}
#screenWrap{position:relative;width:100%;flex:1;border-radius:26px;background:#0c1420;padding:10px;
 box-shadow:inset 0 0 0 6px #1c2534, inset 0 0 30px rgba(0,0,0,.5)}
#screen{position:relative;width:100%;height:100%;border-radius:18px;overflow:hidden}
svg{width:100%;height:100%;display:block;touch-action:none}

.topbar{position:absolute;top:8px;left:8px;right:8px;z-index:10;display:flex;justify-content:space-between;align-items:center}
.moodchip{background:var(--card);backdrop-filter:blur(6px);border-radius:999px;padding:5px 12px;font-weight:800;
 font-size:12px;display:flex;align-items:center;gap:5px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.roundbtn{width:32px;height:32px;border-radius:50%;border:none;background:var(--card);font-size:15px}

.meters{position:absolute;top:44px;left:8px;z-index:10;display:flex;flex-direction:column;gap:5px}
.mrow{background:var(--card);backdrop-filter:blur(6px);border-radius:10px;padding:3px 8px;display:flex;
 align-items:center;gap:6px;font-size:10px;font-weight:800}
.mrow .track{width:56px;height:7px;border-radius:6px;background:#fff;overflow:hidden}
.mrow .fill{height:100%;border-radius:6px;transition:width .5s}

.speech{position:absolute;z-index:12;background:#fff;border-radius:14px;padding:5px 10px;font-size:16px;
 box-shadow:0 3px 8px rgba(0,0,0,.2);opacity:0;transition:opacity .25s,transform .25s;transform:translate(-50%,6px) scale(.85);
 pointer-events:none;white-space:nowrap}
.speech.show{opacity:1;transform:translate(-50%,-4px) scale(1)}
.speech::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
 border:6px solid transparent;border-top-color:#fff}

.notify{position:absolute;left:50%;top:44px;transform:translateX(-50%) translateY(-14px);z-index:20;
 background:rgba(20,14,30,.88);color:#fff;border-radius:14px;padding:9px 16px;font-size:12px;font-weight:700;
 text-align:center;max-width:82%;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.notify.show{opacity:1;transform:translateX(-50%) translateY(0)}

.sparkle-emoji{position:absolute;pointer-events:none;font-size:20px;z-index:15;animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.6)}30%{transform:translateY(-18px) scale(1.15)}100%{opacity:0;transform:translateY(-80px) scale(1)}}

/* ---- botões físicos do aparelho ---- */
#buttons{display:flex;gap:16px;margin-top:16px}
.physbtn{width:64px;height:64px;border-radius:50%;border:none;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:2px;font-family:inherit;font-weight:800;font-size:9px;
 color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15),0 8px 16px rgba(0,0,0,.2);transition:transform .08s}
.physbtn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.15),0 2px 6px rgba(0,0,0,.15)}
.physbtn span{font-size:22px}
#btnFeed{background:linear-gradient(160deg,#ffb877,#ff8f5a)}
#btnPlay{background:linear-gradient(160deg,#8fe0a8,#4fc36c)}
#btnCalm{background:linear-gradient(160deg,#ff9ecf,#ff6fb0)}

.sleepdim{position:absolute;inset:0;background:#050914;opacity:0;transition:opacity .6s;pointer-events:none;z-index:8}
.sleepdim.on{opacity:.62}
.zzz{position:absolute;font-size:20px;opacity:0;transition:opacity .4s;z-index:9;pointer-events:none}
.zzz.on{opacity:1}
</style>
</head>
<body>

<div id="device">
 <div id="screenWrap"><div id="screen">
  <svg id="svg" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice">
   <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0%" stop-color="#bdeaff"/><stop offset="40%" stop-color="#eaf9ff"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0%" stop-color="#8fe3ff"/><stop offset="100%" stop-color="#2f9fd6"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
     <stop offset="0%" stop-color="#fff6d6"/><stop offset="100%" stop-color="#ffd76b"/>
    </radialGradient>
   </defs>
   <rect x="0" y="0" width="400" height="260" fill="url(#skyGrad)"/>
   <circle cx="320" cy="70" r="38" fill="url(#sunGrad)"/>
   <g id="clouds"></g>
   <rect x="0" y="240" width="400" height="460" fill="url(#waterGrad)"/>
   <path d="M0 240 Q100 222 200 240 T400 240 V256 H0 Z" fill="#eaf9ff" opacity=".6"/>
   <rect x="0" y="660" width="400" height="40" fill="#ffe9b3"/>
   <g id="weeds"></g>
   <g id="bubbles"></g>
   <g id="pet"></g>
   <g id="fx"></g>
  </svg>
  <div class="sleepdim" id="sleepdim"></div>
  <div class="zzz" id="zzz" style="top:14px;left:50%;transform:translateX(-50%)">💤</div>

  <div class="topbar">
   <div class="moodchip"><span id="moodEmoji">🙂</span> <span id="moodLabel">feliz</span></div>
   <button class="roundbtn" id="btnMute">🔊</button>
  </div>
  <div class="meters">
   <div class="mrow">🍎<div class="track"><div class="fill" id="fFome" style="background:#ff9f5a"></div></div></div>
   <div class="mrow">⚡<div class="track"><div class="fill" id="fEnergia" style="background:#ffd76b"></div></div></div>
   <div class="mrow">🎈<div class="track"><div class="fill" id="fDiversao" style="background:#7fd8ff"></div></div></div>
   <div class="mrow">😣<div class="track"><div class="fill" id="fEstresse" style="background:#ff6f6f"></div></div></div>
  </div>
  <div class="speech" id="speech">oi!</div>
  <div class="notify" id="notify"></div>
 </div></div>

 <div id="buttons">
  <button class="physbtn" id="btnFeed"><span>🍎</span>alimentar</button>
  <button class="physbtn" id="btnPlay"><span>🎾</span>brincar</button>
  <button class="physbtn" id="btnCalm"><span>💗</span>acalmar</button>
  <button class="physbtn" id="btnSleep" style="background:linear-gradient(160deg,#8fa4ff,#5c72e0)"><span>🌙</span><span id="sleepLbl">dormir</span></button>
 </div>
</div>

<script>
const ns="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
const svg=$("svg"), petLayer=$("pet"), fxLayer=$("fx");
function el(tag,attrs){const e=document.createElementNS(ns,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e}

/* ===================== DNA determinístico do bichinho ===================== */
function hash(s){let h=2166136261>>>0;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h>>>0}
const seed = "tamagotchi-" + Math.floor(Math.random()*99999);
const H = hash(seed);
const dna = {
 hue: H % 360,
 finCount: 2 + (H % 3),
 size: 0.85 + (H % 40)/100,
 speed: 22 + (H % 30),
 shape: ["redondo","comprido","losango"][H % 3],
};
function hsl(h,s,l){return `hsl(${h},${s}%,${l}%)`}

/* ===================== decoração (céu / algas / bolhas) ===================== */
const clouds=$("clouds");
for(let i=0;i<3;i++){
 const c=el("ellipse",{cx:30+i*140,cy:40+Math.random()*30,rx:30,ry:14,fill:"#fff",opacity:.85});
 clouds.appendChild(c); c.dataset.speed=(0.07+Math.random()*0.08).toFixed(3); c.dataset.x=30+i*140;
}
const weeds=$("weeds");
[30,90,150,260,330,375].forEach((x,i)=>{
 const p=el("path",{fill:"none",stroke:"#4fae5c","stroke-width":9,"stroke-linecap":"round"});
 p.dataset.x=x; p.dataset.h=44+(i%3)*18; p.dataset.i=i;
 weeds.appendChild(p);
});
const bubbles=$("bubbles");
const bubbleData=[];
for(let i=0;i<12;i++){
 const r=2+Math.random()*3.5;
 const c=el("circle",{cx:Math.random()*400,cy:260+Math.random()*420,r,fill:"#fff",opacity:.35});
 bubbles.appendChild(c);
 bubbleData.push({el:c,x:+c.getAttribute("cx"),y:+c.getAttribute("cy"),sp:0.25+Math.random()*0.5,drift:Math.random()*2,phase:Math.random()*10});
}

/* ===================== construção do bichinho (a partir da DNA) ===================== */
const color = hsl(dna.hue,72,62);
const colorDark = hsl(dna.hue,60,42);
const petGroup = el("g",{});
petLayer.appendChild(petGroup);

const s = dna.size;
let bodyRx=34*s, bodyRy=24*s;
if(dna.shape==="comprido"){ bodyRx=44*s; bodyRy=18*s; }
if(dna.shape==="losango"){ bodyRx=30*s; bodyRy=30*s; }

const tail = el("path",{d:`M${-bodyRx} 0 L${-bodyRx-18*s} ${-14*s} L${-bodyRx-18*s} ${14*s} Z`, fill:color});
const body = dna.shape==="losango"
 ? el("polygon",{points:`0,${-bodyRy} ${bodyRx},0 0,${bodyRy} ${-bodyRx},0`, fill:color})
 : el("ellipse",{cx:0,cy:0,rx:bodyRx,ry:bodyRy, fill:color});
const belly = el("ellipse",{cx:2*s,cy:8*s,rx:bodyRx*0.55,ry:bodyRy*0.5, fill:"#fff", opacity:.35});
const eyeWhite = el("circle",{cx:14*s,cy:-4*s,r:7*s,fill:"#fff"});
const eyePupil = el("circle",{cx:16*s,cy:-4*s,r:4*s,fill:"#2a2440",id:"pupil"});
const mouth = el("path",{d:`M${4*s} ${10*s} Q${12*s} ${14*s} ${20*s} ${10*s}`, fill:"none", stroke:"#2a2440","stroke-width":2*s,"stroke-linecap":"round",id:"mouth"});
const fins=[];
for(let i=0;i<dna.finCount;i++){
 const f=el("path",{d:`M${-6*s+i*10*s} ${-bodyRy*0.7} Q${-2*s+i*10*s} ${-bodyRy*1.5} ${6*s+i*10*s} ${-bodyRy*0.6} Z`, fill:colorDark, opacity:.85});
 fins.push(f);
}
petGroup.append(tail,body,belly,...fins,eyeWhite,eyePupil,mouth);

/* ===================== estado / física de nado + arraste ===================== */
const pet = {
 pos:{x:200,y:420}, target:{x:200,y:420}, timer:1.4,
 speed:dna.speed, facing:1, dragging:false, pointerId:null,
 spring:{x:0,y:0,vx:0,vy:0,tx:0,ty:0}
};
const STIFF=90, DAMP=9, MAXPULL=44;

function svgPoint(evt){
 const pt=svg.createSVGPoint(); pt.x=evt.clientX; pt.y=evt.clientY;
 const m=svg.getScreenCTM().inverse(); return pt.matrixTransform(m);
}
svg.addEventListener("pointerdown",e=>{
 ensureAudio();
 const p=svgPoint(e); const d=Math.hypot(p.x-pet.pos.x,p.y-pet.pos.y);
 if(d<60){
  pet.dragging=true; pet.pointerId=e.pointerId; svg.setPointerCapture(e.pointerId);
  blip(700+Math.random()*200,.1,"sine",.14);
  bumpStat("diversao",4); showSpeech("hihi!");
 }
});
svg.addEventListener("pointermove",e=>{
 if(!pet.dragging||e.pointerId!==pet.pointerId) return;
 const p=svgPoint(e); let dx=p.x-pet.pos.x, dy=p.y-pet.pos.y; const m=Math.hypot(dx,dy);
 if(m>MAXPULL){dx=dx/m*MAXPULL; dy=dy/m*MAXPULL}
 pet.spring.tx=dx; pet.spring.ty=dy;
});
function release(e){ if(e.pointerId!==pet.pointerId) return; pet.dragging=false; pet.pointerId=null; pet.timer=0.2; }
svg.addEventListener("pointerup",release); svg.addEventListener("pointercancel",release);

/* ===================== necessidades (fome / energia / diversão / estresse) ===================== */
const stat = { fome:72, energia:75, diversao:65, estresse:15 };
let sleeping=false;
function clamp(v){return Math.max(0,Math.min(100,v))}
function bumpStat(k,delta){ stat[k]=clamp(stat[k]+delta); paintMeters(); }
function paintMeters(){
 fFome.style.width=stat.fome+"%"; fEnergia.style.width=stat.energia+"%";
 fDiversao.style.width=stat.diversao+"%"; fEstresse.style.width=stat.estresse+"%";
}
paintMeters();

const MOODS = [
 { key:"estresse_alto", test:()=>stat.estresse>72, emoji:"😣", label:"estressado", msg:"tá tudo tão agitado... um carinho ajudaria." },
 { key:"fome", test:()=>stat.fome<28, emoji:"😋", label:"com fome", msg:"meu bichinho tá com fome!" },
 { key:"sono", test:()=>stat.energia<25 && !sleeping, emoji:"🥱", label:"com sono", msg:"ele tá caindo de sono..." },
 { key:"tedio", test:()=>stat.diversao<28, emoji:"🥱", label:"entediado", msg:"ele quer brincar com você!" },
 { key:"dormindo", test:()=>sleeping, emoji:"💤", label:"dormindo", msg:"" },
 { key:"feliz", test:()=>true, emoji:"🙂", label:"feliz", msg:"" },
];
let lastMoodKey=null, lastNotifyAt=0;
function currentMood(){ return MOODS.find(m=>m.test()); }
function updateMoodUI(){
 const m=currentMood();
 moodEmoji.textContent=m.emoji; moodLabel.textContent=m.label;
 const now=performance.now();
 if(m.key!==lastMoodKey || (m.msg && now-lastNotifyAt>26000 && m.key!=="feliz" && m.key!=="dormindo")){
  if(m.msg){ notify(m.msg); if(m.key!==lastMoodKey) reactToMood(m.key); }
  lastNotifyAt=now;
 }
 lastMoodKey=m.key;
}
function reactToMood(key){
 if(key==="fome") blip(300,.25,"sawtooth",.12);
 if(key==="estresse_alto") blip(200,.3,"square",.1);
 if(key==="sono") blip(420,.35,"sine",.08);
 if(key==="tedio") blip(500,.2,"triangle",.1);
}

let notifyTimer=null;
function notify(msg){
 const n=$("notify"); n.textContent=msg; n.classList.add("show");
 clearTimeout(notifyTimer); notifyTimer=setTimeout(()=>n.classList.remove("show"),3400);
}
let speechTimer=null;
function showSpeech(msg){
 const sp=$("speech"); sp.textContent=msg; sp.classList.add("show");
 clearTimeout(speechTimer); speechTimer=setTimeout(()=>sp.classList.remove("show"),1200);
}

/* decadência natural das necessidades — mais lenta dormindo */
setInterval(()=>{
 if(sleeping){
  stat.energia=clamp(stat.energia+3.2);
  stat.fome=clamp(stat.fome-0.5);
  stat.estresse=clamp(stat.estresse-1.4);
 } else {
  stat.fome=clamp(stat.fome-1.3);
  stat.energia=clamp(stat.energia-0.9);
  stat.diversao=clamp(stat.diversao-1.1);
  stat.estresse=clamp(stat.estresse+0.7);
 }
 paintMeters(); updateMoodUI();
}, 3500);

/* ===================== som (Web Audio) ===================== */
let actx=null, muted=false, musicOn=false;
function ensureAudio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }
function blip(freq=520,dur=.14,type="sine",vol=.16){
 if(muted) return; ensureAudio();
 const t0=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
 o.type=type; o.frequency.setValueAtTime(freq,t0);
 o.frequency.exponentialRampToValueAtTime(Math.max(60,freq*0.7),t0+dur);
 g.gain.setValueAtTime(0.0001,t0);
 g.gain.exponentialRampToValueAtTime(vol,t0+0.02);
 g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
 o.connect(g); g.connect(actx.destination);
 o.start(t0); o.stop(t0+dur+0.02);
}
const MELODY=[523,587,659,784,659,587, 523,659,784,880,784,659];
let melodyIdx=0, melodyTimer=null;
function scheduleMelody(){
 clearTimeout(melodyTimer);
 if(!musicOn||muted){ melodyTimer=setTimeout(scheduleMelody,500); return; }
 const note=MELODY[melodyIdx%MELODY.length]; melodyIdx++;
 blip(note, sleeping?0.7:0.45, "sine", sleeping?0.03:0.05);
 melodyTimer=setTimeout(scheduleMelody, sleeping?700:430);
}
$("btnMute").addEventListener("click",()=>{
 muted=!muted; $("btnMute").textContent=muted?"🔇":"🔊";
 if(!muted && !musicOn){ ensureAudio(); musicOn=true; scheduleMelody(); }
});

/* ===================== ações (botões físicos) ===================== */
function sparkleAt(x,y,emoji){
 const rect=svg.getBoundingClientRect();
 const px = rect.left + (x/400)*rect.width;
 const py = rect.top + (y/700)*rect.height;
 const span=document.createElement("div");
 span.className="sparkle-emoji"; span.textContent=emoji;
 span.style.left=(px-10)+"px"; span.style.top=(py-10)+"px";
 document.body.appendChild(span);
 setTimeout(()=>span.remove(),1150);
}
$("btnFeed").addEventListener("click",()=>{
 ensureAudio(); bumpStat("fome",22); bumpStat("estresse",-4);
 blip(700,.12,"triangle",.16); setTimeout(()=>blip(500,.12,"triangle",.14),90);
 sparkleAt(pet.pos.x,pet.pos.y-24,"🍎"); showSpeech("nham!"); mouthChomp();
 updateMoodUI();
});
$("btnPlay").addEventListener("click",()=>{
 ensureAudio(); bumpStat("diversao",22); bumpStat("estresse",-8); bumpStat("energia",-6);
 blip(880,.12,"triangle",.14); setTimeout(()=>blip(1046,.12,"triangle",.12),90);
 sparkleAt(pet.pos.x,pet.pos.y-24,"🎾"); showSpeech("uhuul!"); bounce();
 updateMoodUI();
});
$("btnCalm").addEventListener("click",()=>{
 ensureAudio(); bumpStat("estresse",-24); bumpStat("diversao",4);
 blip(660,.2,"sine",.12);
 sparkleAt(pet.pos.x,pet.pos.y-24,"💗"); showSpeech("aaah, relaxa..."); 
 updateMoodUI();
});
$("btnSleep").addEventListener("click",()=>{
 sleeping=!sleeping;
 $("sleepdim").classList.toggle("on",sleeping);
 $("zzz").classList.toggle("on",sleeping);
 $("sleepLbl").textContent = sleeping?"acordar":"dormir";
 if(sleeping){ showSpeech("boa noite..."); } else { showSpeech("bom dia!"); blip(760,.18,"sine",.14); }
 updateMoodUI();
});

function mouthChomp(){
 mouth.setAttribute("d",`M${2*s} ${12*s} Q${12*s} ${4*s} ${22*s} ${12*s}`);
 setTimeout(()=>mouth.setAttribute("d",`M${4*s} ${10*s} Q${12*s} ${14*s} ${20*s} ${10*s}`),260);
}
let bounceT=0;
function bounce(){ bounceT=1; }

/* ===================== loop principal ===================== */
let lastT=performance.now();
function loop(now){
 const dt=Math.min(0.05,(now-lastT)/1000); lastT=now; const t=now/1000;

 clouds.querySelectorAll("ellipse").forEach(c=>{
  let x=+c.dataset.x + t*(+c.dataset.speed); if(x>440) x=-40;
  c.dataset.x=x; c.setAttribute("cx",x);
 });
 weeds.querySelectorAll("path").forEach(p=>{
  const x=+p.dataset.x, h=+p.dataset.h, i=+p.dataset.i, sway=Math.sin(t*1.1+i)*10;
  p.setAttribute("d",`M${x} 700 Q${x-12+sway} ${700-h*.5} ${x+sway*.4} ${700-h}`);
 });
 bubbleData.forEach(b=>{
  const sp = sleeping? b.sp*0.3 : b.sp;
  b.y-=sp; b.x+=Math.sin(t*0.8+b.phase)*b.drift*0.25;
  if(b.y<240){ b.y=690; b.x=Math.random()*400; }
  b.el.setAttribute("cx",b.x); b.el.setAttribute("cy",b.y);
 });

 if(!pet.dragging){
  pet.timer-=dt;
  const speedMult = sleeping?0.25:1;
  const d=Math.hypot(pet.target.x-pet.pos.x, pet.target.y-pet.pos.y);
  if(d<10||pet.timer<=0){
   pet.target={x:60+Math.random()*280, y:300+Math.random()*340};
   pet.timer=2.2+Math.random()*3;
  }
  const dx=pet.target.x-pet.pos.x, dy=pet.target.y-pet.pos.y, dist=Math.hypot(dx,dy)||1;
  const step=Math.min(dist,pet.speed*speedMult*dt);
  pet.pos.x+=dx/dist*step; pet.pos.y+=dy/dist*step;
  pet.facing = dx<0?-1:1;
 }
 const tx=pet.dragging?pet.spring.tx:0, ty=pet.dragging?pet.spring.ty:0;
 pet.spring.vx+=((tx-pet.spring.x)*STIFF - pet.spring.vx*DAMP)*dt;
 pet.spring.vy+=((ty-pet.spring.y)*STIFF - pet.spring.vy*DAMP)*dt;
 pet.spring.x+=pet.spring.vx*dt; pet.spring.y+=pet.spring.vy*dt;

 if(bounceT>0){ bounceT=Math.max(0,bounceT-dt*2.2); }
 const bob = sleeping ? Math.sin(t*0.8)*3 : Math.sin(t*2.4+pet.pos.x*0.02)*4 + bounceT*14*Math.abs(Math.sin(t*10));
 const px=pet.pos.x+pet.spring.x, py=pet.pos.y+pet.spring.y+bob;
 const scaleX=(pet.facing<0?-1:1)*s;
 petGroup.setAttribute("transform",`translate(${px} ${py}) scale(${scaleX} ${s}) rotate(${pet.spring.y*0.5})`);

 // olhos fecham dormindo
 eyeWhite.setAttribute("ry", sleeping? 1.2 : 7*s);
 eyePupil.setAttribute("opacity", sleeping? 0 : 1);

 // posiciona balão de fala e zzz acima do bichinho (coords de tela)
 const rect=svg.getBoundingClientRect();
 const sx = rect.left + (px/400)*rect.width;
