<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PICAPE — πKP — V0</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;color:#dfe7ef;font-family:system-ui,sans-serif}#stage{position:fixed;inset:0;background:radial-gradient(circle at 50% 43%,rgba(255,188,13,.1),transparent 23%),radial-gradient(circle at 50% 55%,rgba(30,120,255,.07),transparent 42%),#080b10;touch-action:none}#stage:before{content:"";position:absolute;inset:-20%;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:42px 42px;transform:perspective(600px) rotateX(63deg) translateY(18%);transform-origin:center bottom}.brand{position:absolute;z-index:8;left:16px;top:12px;font:700 12px monospace;letter-spacing:.22em}.brand small{display:block;margin-top:7px;color:#687381;font:400 9px monospace;letter-spacing:.12em}.read{position:absolute;z-index:8;right:16px;top:12px;text-align:right;color:#ffbc0d;font:700 12px monospace}.read span{display:block;margin-top:7px;color:#75808e;font-size:9px}#logo{position:absolute;z-index:7;left:50%;top:16%;transform:translateX(-50%);text-align:center;white-space:nowrap}.main{font-size:42px;font-weight:700}.pi{font-family:Georgia,serif;font-style:italic;color:#ffbc0d;text-shadow:0 0 7px #ffbc0d,0 0 24px rgba(255,188,13,.45)}.kp{font-family:monospace;color:#dce3ea}.sub{margin-top:10px;color:#596574;font:600 8px monospace;letter-spacing:.3em}#organism{position:absolute;z-index:3;left:50%;top:44%;width:300px;height:300px;transform:translate(-50%,-50%);touch-action:none}#orgSvg{width:100%;height:100%;overflow:visible}.orbital{fill:none;stroke:rgba(255,188,13,.34);stroke-width:1}.orbital.blue{stroke:rgba(60,155,255,.26)}#coreBall{fill:url(#g);filter:drop-shadow(0 0 13px rgba(255,188,13,.75))}#orbitLattice{opacity:0;stroke:#46a7ff;fill:none;stroke-width:1.1}#voidDots{opacity:0;fill:#aeb8c4}.node{fill:#ffbc0d;filter:drop-shadow(0 0 5px rgba(255,188,13,.8))}.fx{position:absolute;z-index:4;padding:6px 8px;border:1px solid rgba(84,170,255,.22);border-radius:8px;background:rgba(6,12,19,.65);font:700 8px monospace;color:#5f7892;transition:.15s}.fx.hot{color:#ffbc0d;border-color:rgba(255,188,13,.55)}#fx1{left:calc(50% - 195px);top:43%}#fx2{left:calc(50% + 150px);top:32%}#fx3{left:calc(50% + 145px);top:57%}#panels{position:absolute;z-index:10;left:10px;right:10px;bottom:82px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.panel,.block{background:rgba(10,14,20,.82);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:10px;backdrop-filter:blur(12px)}.panel h4,label{margin:0 0 8px;color:#687381;font:700 8px monospace;letter-spacing:.15em}.row{display:flex;justify-content:space-between;font:600 10px monospace}.muted{color:#687381}.amber{color:#ffbc0d}.cyan{color:#54aaff}.meter{height:5px;margin-top:8px;border-radius:5px;background:#151c25;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#ffbc0d,#fff0a8);box-shadow:0 0 10px rgba(255,188,13,.55)}input{width:100%;accent-color:#ffbc0d}#bottom{position:absolute;z-index:12;left:10px;right:10px;bottom:10px;display:flex;gap:8px}.block{flex:1}.dyn{height:58px;display:flex;gap:8px;align-items:end}.bar{width:10px;border-radius:5px;background:linear-gradient(#fff1a3,#ffbc0d);box-shadow:0 0 12px rgba(255,188,13,.35)}.trace{height:1px;flex:1;background:linear-gradient(90deg,rgba(255,188,13,.8),rgba(255,188,13,0));transform:skewY(-8deg)}#flow{display:flex;align-items:center;justify-content:space-between;font:700 8px monospace;color:#788493}.pulse{width:24px;height:1px;background:#34404e}#fab{position:absolute;z-index:30;right:15px;bottom:150px;width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,188,13,.45);background:rgba(18,19,18,.9);color:#ffbc0d;font:700 19px Georgia;box-shadow:0 0 24px rgba(255,188,13,.15)}#menu{position:absolute;z-index:29;right:18px;bottom:211px;display:none;flex-direction:column;gap:7px;align-items:flex-end}.act{border:1px solid rgba(255,255,255,.1);background:rgba(9,13,18,.94);color:#bdc7d2;border-radius:9px;padding:8px 10px;font:700 8px monospace}#hint{position:absolute;z-index:6;left:50%;top:65%;transform:translateX(-50%);font:600 7px monospace;letter-spacing:.18em;color:#414b58;white-space:nowrap}#log{position:absolute;z-index:20;left:10px;top:68px;width:190px;max-height:80px;overflow:hidden;pointer-events:none;font:7px/1.5 monospace;color:#4e5a68}@media(max-width:430px){#organism{width:270px;height:270px}#logo{top:14%}}</style></head><body><div id="stage"><div class="brand">LABRIOLAG<small>LABORATÓRIO 137 · PICAPE</small></div><div class="read"><b id="state">REST</b><span>ENERGIA <strong id="energyRead">62</strong></span></div><div id="logo"><div class="main"><span class="pi">π</span><span class="kp">KP</span></div><div class="sub">PALCO · V0</div></div><div class="fx" id="fx1">FILTER</div><div class="fx" id="fx2">DELAY</div><div class="fx" id="fx3">REVERB</div><div id="organism"><svg id="orgSvg" viewBox="0 0 300 300"><defs><radialGradient id="g"><stop offset="0" stop-color="#fffbdc"/><stop offset=".22" stop-color="#ffdc55"/><stop offset=".62" stop-color="#ffbc0d" stop-opacity=".7"/><stop offset="1" stop-color="#ffbc0d" stop-opacity="0"/></radialGradient></defs><ellipse class="orbital" cx="150" cy="150" rx="118" ry="42"/><ellipse class="orbital blue" cx="150" cy="150" rx="94" ry="54" transform="rotate(58 150 150)"/><ellipse class="orbital" cx="150" cy="150" rx="68" ry="25" transform="rotate(-28 150 150)"/><circle id="coreBall" cx="150" cy="150" r="42"/><g id="orbitLattice"><polygon points="150,70 221,110 221,190 150,230 79,190 79,110"/><polygon points="150,92 201,121 201,179 150,208 99,179 99,121"/><line x1="79" y1="110" x2="201" y2="179"/><line x1="221" y1="110" x2="99" y2="179"/><line x1="79" y1="190" x2="201" y2="121"/><line x1="221" y1="190" x2="99" y2="121"/></g><g id="voidDots"><circle cx="150" cy="62" r="2"/><circle cx="228" cy="119" r="2"/><circle cx="207" cy="215" r="2"/><circle cx="104" cy="218" r="2"/><circle cx="70" cy="137" r="2"/><circle cx="179" cy="82" r="1.5"/><circle cx="122" cy="188" r="1.5"/><circle cx="196" cy="153" r="1.5"/></g><circle class="node" cx="150" cy="150" r="2.5"/></svg></div><div id="hint">ARRASTE · IMPULSO · METAMORFOSE · OBSERVE</div><div id="log"></div><div id="panels"><div class="panel"><h4>IDENTIDADE</h4><div class="row"><span class="muted">DNA</span><span class="cyan" id="dna">7A</span></div><div class="meter"><i style="width:42%"></i></div><div style="margin-top:7px;font-size:7px;color:#586473">Identidade do organismo — não muda com energia nem com o pulso do núcleo.</div></div><div class="panel"><h4>ENERGIA</h4><div class="row"><span class="amber" id="energyBig">62</span><span class="muted">FIELD</span></div><input id="energy" type="range" min="0" max="100" value="62"><div class="row"><span class="muted">OBSERVADOR</span><span id="observer">NEUTRO</span></div></div></div><div id="bottom"><div class="block"><label>DINÂMICA</label><div class="dyn"><div class="bar" id="dynbar" style="height:62%"></div><div class="trace"></div></div></div><div class="block"><label>FLOW</label><div id="flow"><span>INPUT</span><i class="pulse"></i><span>FX</span><i class="pulse"></i><span>MASTER</span></div><div class="meter"><i id="master" style="width:62%"></i></div></div></div><div id="menu"><button class="act" id="impulse">IMPULSO</button><button class="act" id="meta">METAMORF.</button><button class="act" id="observe">OBSERVAR</button><button class="act" id="reset">RESET</button></div><button id="fab">π</button></div><script>const Core=(()=>{const s={energy:62,state:'REST',observer:'NEUTRO',manifestation:'core',dna:'7A',entities:{A:{x:0,y:0,state:'presente'},B:{x:1,y:0,state:'presente'}},relation:{active:false,strength:0},field:{radius:1,influence:.5,noise:.08},trajectory:[],events:[]};function emit(type,p={}){const e={id:s.events.length+1,type,time:Date.now(),state:s.state,...p};s.events.push(e);if(s.events.length>60)s.events.shift()}function impulse(){const before=s.state;s.energy=Math.min(100,s.energy+8);s.state=s.energy>78?'CLIMAX':'MOVEMENT';s.trajectory.push({x:Math.random(),y:Math.random(),t:Date.now()});s.relation.active=true;s.relation.strength=Math.min(1,s.relation.strength+.12);emit('IMPULSO',{stateBefore:before,stateAfter:s.state})}function metamorph(){const o=['core','orbit','void'],i=o.indexOf(s.manifestation);s.manifestation=o[(i+1)%o.length];emit('METAMORFOSE',{manifestation:s.manifestation})}function observe(){const o=['NEUTRO','PRÓXIMO','DISTANTE','CEGO'];s.observer=o[(o.indexOf(s.observer)+1)%o.length];emit('OBSERVAÇÃO',{observer:s.observer})}function reset(){s.energy=62;s.state='REST';s.observer='NEUTRO';s.manifestation='core';s.relation={active:false,strength:0};s.trajectory=[];s.events=[];emit('RESET')}return{s,impulse,metamorph,observe,reset,emit}})();const $=id=>document.getElementById(id);let dragging=false,lastX=0,angle=0;function render(){const s=Core.s;$('energyRead').textContent=Math.round(s.energy);$('energyBig').textContent=Math.round(s.energy);$('energy').value=s.energy;$('state').textContent=s.state;$('observer').textContent=s.observer;$('master').style.width=Math.max(8,s.energy)+'%';$('dynbar').style.height=Math.max(8,s.energy)+'%';$('coreBall').style.opacity=s.manifestation==='core'?1:0;$('orbitLattice').style.opacity=s.manifestation==='orbit'?1:0;$('voidDots').style.opacity=s.manifestation==='void'?1:.12;$('log').innerHTML=s.events.slice(-5).reverse().map(e=>new Date(e.time).toLocaleTimeString('pt-BR')+' · '+e.type).join('<br>')}function bind(){ $('energy').oninput=e=>{Core.s.energy=+e.target.value;Core.s.state=Core.s.energy>78?'CLIMAX':Core.s.energy>35?'MOVEMENT':'REST';Core.emit('ENERGIA',{value:Core.s.energy});render()};$('impulse').onclick=()=>{Core.impulse();render()};$('meta').onclick=()=>{Core.metamorph();render()};$('observe').onclick=()=>{Core.observe();render()};$('reset').onclick=()=>{Core.reset();render()};$('fab').onclick=()=>{$('menu').style.display=$('menu').style.display==='flex'?'none':'flex'};$('organism').onpointerdown=e=>{dragging=true;lastX=e.clientX;$('organism').setPointerCapture(e.pointerId)};$('organism').onpointermove=e=>{if(!dragging)return;angle+=(e.clientX-lastX)*.7;lastX=e.clientX;$('organism').style.transform='translate(-50%,-50%) rotate('+angle+'deg)';Core.s.trajectory.push({x:e.clientX,y:e.clientY,t:Date.now()});Core.s.energy=Math.min(100,Core.s.energy+.08);Core.s.state=Core.s.energy>78?'CLIMAX':'MOVEMENT';render()};$('organism').onpointerup=()=>{dragging=false;Core.s.state=Core.s.energy>65?'MOVEMENT':'REST';Core.emit('TRAJETÓRIA',{length:Core.s.trajectory.length});render()};$('stage').onpointermove=e=>{[['fx1',35,.43],['fx2',350,.32],['fx3',345,.57]].forEach(([id,x,y])=>{const el=$(id),r=el.getBoundingClientRect(),d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));el.classList.toggle('hot',d<85)})}}bind();render();</script></body></html>
