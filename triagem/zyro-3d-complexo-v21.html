/* =====================================================
   PISTA DE SKATE
===================================================== */

const RAMP_WIDTH = 5.0;
const THICK = 0.3;

const Z1 = 0;
const Z2 = RAMP_WIDTH;

function buildSideWall(
  x1,
  y1,
  x2,
  y2,
  zCenter,
  width
) {

  const maxY = Math.max(y1,y2);

  if(maxY <= 0.05) return;

  const shape = new THREE.Shape();

  shape.moveTo(x1,0);
  shape.lineTo(x1,y1);
  shape.lineTo(x2,y2);
  shape.lineTo(x2,0);
  shape.closePath();

  const geometry =
    new THREE.ExtrudeGeometry(
      shape,
      {
        depth: width,
        bevelEnabled:false
      }
    );

  const wall =
    new THREE.Mesh(
      geometry,
      wallMat
    );

  wall.position.z =
    zCenter - width / 2;

  wall.castShadow = true;
  wall.receiveShadow = true;

  scene.add(wall);
}


function segment(
  x1,y1,z1,
  x2,y2,z2,
  width = RAMP_WIDTH
) {

  const dx = x2-x1;
  const dy = y2-y1;
  const dz = z2-z1;

  const len =
    Math.hypot(dx,dy,dz);

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        len,
        THICK,
        width
      ),
      concreteMat
    );

  mesh.position.set(
    (x1+x2)/2,
    (y1+y2)/2,
    (z1+z2)/2
  );

  mesh.rotation.z =
    Math.atan2(dy,dx);

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  scene.add(mesh);

  buildSideWall(
    x1,y1,
    x2,y2,
    z1,
    width
  );

  return mesh;
}


function curveUp(
  x0,
  y0,
  radius,
  angleDeg,
  z,
  dirX,
  segs = 14,
  width = RAMP_WIDTH
) {

  const pts = [];

  const total =
    angleDeg * Math.PI / 180;

  for(let i=0;i<=segs;i++) {

    const t =
      (i/segs) * total;

    pts.push([
      x0 +
      dirX *
      radius *
      Math.sin(t),

      y0 +
      radius *
      (1-Math.cos(t))
    ]);
  }

  for(let i=0;i<segs;i++) {

    segment(
      pts[i][0],
      pts[i][1],
      z,

      pts[i+1][0],
      pts[i+1][1],
      z,

      width
    );
  }

  return pts[segs];
}


function longRail(
  xCenter,
  yTop,
  z,
  length
) {

  const g =
    new THREE.Group();

  const barHeight = 0.42;

  [-length/2,length/2]
  .forEach(xOff => {

    const post =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          0.035,
          0.035,
          barHeight,
          8
        ),
        metalMat
      );

    post.position.set(
      xOff,
      barHeight/2,
      0
    );

    g.add(post);
  });

  const bar =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.03,
        0.03,
        length,
        8
      ),
      metalMat
    );

  bar.rotation.z =
    Math.PI/2;

  bar.position.y =
    barHeight;

  g.add(bar);

  g.position.set(
    xCenter,
    yTop,
    z
  );

  scene.add(g);
}


/* =====================================================
   DIMENSÕES DA PISTA
===================================================== */

const miniRampHeight = 3.6;
const miniRampRadius = 3.6;
const flatBottomLength = 4.5;
const topFlat = 3.0;
const runCaixote = 2.0;
const hipHeight = 1.4;

const X_BACK_LIMIT = -16;

// FIX: deck do mini-ramp recuado de +3 para +2 (menos saliência
// para o lado da quadra)
const MINI_RAMP_DECK_LENGTH = 2.0;


/* =====================================================
   LADO 1
===================================================== */

const xP1_MiniBase1 = 18;

curveUp(
  xP1_MiniBase1,
  0,
  miniRampRadius,
  95,
  Z1,
  1,
  14
);

const xP1_MiniBase2 =
  xP1_MiniBase1 -
  flatBottomLength;

segment(
  xP1_MiniBase1,
  0,
  Z1,
  xP1_MiniBase2,
  0,
  Z1
);

const topP1_MiniLeft =
  curveUp(
    xP1_MiniBase2,
    0,
    miniRampRadius,
    95,
    Z1,
    -1,
    14
  );


segment(
  xP1_MiniBase1,
  miniRampHeight,
  Z1,
  xP1_MiniBase1 + MINI_RAMP_DECK_LENGTH,
  miniRampHeight,
  Z1
);


const xP1_PlateauHighEnd =
  topP1_MiniLeft[0] -
  3.5;

segment(
  topP1_MiniLeft[0],
  miniRampHeight,
  Z1,

  xP1_PlateauHighEnd,
  miniRampHeight,
  Z1
);


const xP1_Ramp45DownEnd =
  xP1_PlateauHighEnd -
  miniRampHeight;

segment(
  xP1_PlateauHighEnd,
  miniRampHeight,
  Z1,

  xP1_Ramp45DownEnd,
  0,
  Z1
);


const xP1_CaixoteStart =
  xP1_Ramp45DownEnd -
  4;

segment(
  xP1_Ramp45DownEnd,
  0,
  Z1,

  xP1_CaixoteStart,
  0,
  Z1
);


const xP1_CaixoteTopStart =
  xP1_CaixoteStart -
  runCaixote;

const xP1_CaixoteTopEnd =
  xP1_CaixoteTopStart -
  topFlat;

const xP1_CaixoteDownEnd =
  xP1_CaixoteTopEnd -
  runCaixote;


segment(
  xP1_CaixoteStart,
  0,
  Z1,

  xP1_CaixoteTopStart,
  hipHeight,
  Z1
);

segment(
  xP1_CaixoteTopStart,
  hipHeight,
  Z1,

  xP1_CaixoteTopEnd,
  hipHeight,
  Z1
);

segment(
  xP1_CaixoteTopEnd,
  hipHeight,
  Z1,

  xP1_CaixoteDownEnd,
  0,
  Z1
);

longRail(
  (xP1_CaixoteTopStart +
   xP1_CaixoteTopEnd)/2,

  hipHeight + THICK/2,

  Z1,

  topFlat + 0.4
);


const xP1_QuarterBase =
  xP1_CaixoteDownEnd -
  4.5;

segment(
  xP1_CaixoteDownEnd,
  0,
  Z1,

  xP1_QuarterBase,
  0,
  Z1
);


const radius90 = 4.5;

for(let i=0;i<12;i++) {

  const t1 =
    (i/12) *
    (Math.PI/2);

  const t2 =
    ((i+1)/12) *
    (Math.PI/2);

  segment(

    xP1_QuarterBase -
    radius90 *
    Math.sin(t1),

    radius90 *
    (1-Math.cos(t1)),

    Z1,

    xP1_QuarterBase -
    radius90 *
    Math.sin(t2),

    radius90 *
    (1-Math.cos(t2)),

    Z1
  );
}

segment(
  xP1_QuarterBase-radius90,
  radius90,
  Z1,

  X_BACK_LIMIT,
  radius90,
  Z1
);


/* =====================================================
   LADO 2
===================================================== */

curveUp(
  xP1_MiniBase1,
  0,
  miniRampRadius,
  95,
  Z2,
  1,
  14
);

segment(
  xP1_MiniBase1,
  0,
  Z2,

  xP1_MiniBase2,
  0,
  Z2
);

const topP2_MiniLeft =
  curveUp(
    xP1_MiniBase2,
    0,
    miniRampRadius,
    95,
    Z2,
    -1,
    14
  );

segment(
  xP1_MiniBase1,
  miniRampHeight,
  Z2,

  xP1_MiniBase1 + MINI_RAMP_DECK_LENGTH,
  miniRampHeight,
  Z2
);


const xP2_PlateauShortEnd =
  topP2_MiniLeft[0] -
  1.8;

segment(
  topP2_MiniLeft[0],
  miniRampHeight,
  Z2,

  xP2_PlateauShortEnd,
  miniRampHeight,
  Z2
);


for(let i=0;i<12;i++) {

  const t1 =
    (i/12) *
    (Math.PI/2);

  const t2 =
    ((i+1)/12) *
    (Math.PI/2);

  segment(

    xP2_PlateauShortEnd -
    miniRampRadius *
    (1-Math.cos(t1)),

    miniRampHeight -
    miniRampRadius *
    Math.sin(t1),

    Z2,

    xP2_PlateauShortEnd -
    miniRampRadius *
    (1-Math.cos(t2)),

    miniRampHeight -
    miniRampRadius *
    Math.sin(t2),

    Z2
  );
}


const xP2_DropBottom =
  xP2_PlateauShortEnd -
  miniRampRadius;

segment(
  xP2_DropBottom,
  0,
  Z2,

  xP1_CaixoteStart,
  0,
  Z2
);

segment(
  xP1_CaixoteStart,
  0,
  Z2,

  xP1_CaixoteTopStart,
  hipHeight,
  Z2
);

segment(
  xP1_CaixoteTopStart,
  hipHeight,
  Z2,

  xP1_CaixoteTopEnd,
  hipHeight,
  Z2
);

  xP1_CaixoteTopEnd,
  hipHeight,
  Z2,

  xP1_CaixoteDownEnd,
  0,
  Z2
);

longRail(

/* Rampa 45° */

const xP2_Ramp45Start =

  miniRampHeight;


segment(
  xP1_CaixoteDownEnd,
  0,
  Z2,

  Z2

  0,
  Z2,

/* =====================================================

   Com courtX=25 sobra ~3.4 unidades de respiro.
===================================================== */

const courtL = 12;
const courtW = 10;

const basketX =

courtLine(

  5,
  3.6
);

courtLine(
  basketX - 5,
  courtCenterZ,
  0.1,
  3.6

const hoop =
  new THREE.Group();


const hoopPole =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      0.09,
      0.09,
      4,
      12
    ),
    metalMat
  );

hoopPole.position.y =
  2;

hoop.add(hoopPole);


const board =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      0.08,
      1.1,
      1.7
    ),
    lineMat
  );

board.position.set(
  -0.6,
  3.3,
  0

hoop.add(board);

    new THREE.TorusGeometry(

      0.03,
      8,
      16

rim.rotation.x =

rim.position.set(
  -0.9,
  2.95,
  0

  basketX + 0.8,
  0,
  courtCenterZ

/* =====================================================
   PRAÇA
===================================================== */

const parkX = -28;

const plazaZ =
  RAMP_WIDTH/2;

      8.5,

plaza.position.set(

    new THREE.CylinderGeometry(

  );

  plazaZ
);

    color:0xe53935
  });

  new THREE.MeshStandardMaterial({
    color:0xffeb3b
  });

  const a =
    Math.random() *
    Math.PI * 2;

  const r =
    Math.random() * 2.5;

  const flower =
    new THREE.Mesh(
      new THREE.SphereGeometry(

        6,

      Math.random() > 0.5
        ? flowerRed
        : flowerYellow
    );

    parkX +
    Math.cos(a)*r,

    0.4,

    plazaZ +
    Math.sin(a)*r
  );

  scene.add(flower);
}

   BANCOS DA PRAÇA
===================================================== */

function addBench(
  x,
  z,
  rotY
) {

  const g =
    new THREE.Group();


  const seat =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2,
        0.08,
        0.5
      ),
      benchMat
    );

  seat.position.y =
    0.45;

  g.add(seat);


  const back =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2,
        0.4,
        0.06
      ),
      benchMat
    );

  back.position.set(
    0,
    0.7,
    -0.22
  );

  g.add(back);


  [-0.8,0.8]
  .forEach(px => {

    const leg =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          0.08,
          0.45,
          0.48
        ),
        metalMat
      );

    leg.position.set(
      px,
      0.225,
      0
    );

    g.add(leg);
  });


  g.position.set(
    x,
    0,
    z
  );

  g.rotation.y =
    rotY;

  scene.add(g);
}


addBench(
  parkX - 4,
  plazaZ - 5.5,
  0
);

addBench(
  parkX + 4,
  plazaZ - 5.5,
  0
);

   ACADEMIA AO AR LIVRE
===================================================== */

const gymZ =

function addGymEquipment(
  x,
  z,
  type
) {

  const g =
    new THREE.Group();


  const post =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.07,
        0.07,
        1.8,
        10
      ),
      gymMat
    );

  post.position.y =
    0.9;

  g.add(post);


  if(type === "barra") {

    const bar =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          0.045,
          0.045,
          1.4,
          10
        ),
        gymMat
      );

    bar.rotation.z =
      Math.PI/2;

    bar.position.y =
      1.65;

    g.add(bar);
  }


  if(type === "twister") {

    const disc =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          0.38,
          0.38,
          0.08,
          16
        ),
        gymMat
      );

    disc.position.y =
      0.1;

    g.add(disc);
  }


  if(type === "simulador") {

    const step =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          0.8,
          0.12,
          0.35
        ),
        gymMat
      );

    step.position.set(
      -0.35,
      0.25,
      0
    );

    g.add(step);

    const step2 =
      step.clone();

    step2.position.x =
      0.35;

    g.add(step2);
  }


  g.position.set(
    x,
    0,
    z
  );

  scene.add(g);
}


addGymEquipment(
  gymX - 3,
  gymZ - 3,
  "twister"
);

addGymEquipment(
  gymX + 3,
  gymZ - 3,
  "simulador"
);

addGymEquipment(
  gymX - 3,
  gymZ + 3,
  "barra"
);

addGymEquipment(
  gymX + 3,
  gymZ + 3,
  "twister"
);


/* =====================================================
   ÁRVORES
===================================================== */

function addTree(
  x,
  z
) {

  const g =
    new THREE.Group();


  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.2,
        0.3,
        2.5
      ),
      new THREE.MeshStandardMaterial({
        color:0x5a3d2b
      })
    );

  trunk.position.y =
    1.25;

  g.add(trunk);


  const foliage =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1.8,
        12,
        12
      ),
      treeMat
    );

  foliage.position.y =
    3.2;

  g.add(foliage);


  g.position.set(
    x,
    0,
    z
  );

  scene.add(g);
}


[
  [-20,13],
  [-8,14],
  [8,14],
  [20,14],
  [34,14]
]
.forEach(p =>
  addTree(p[0],p[1])
);


/* =====================================================
   ILUMINAÇÃO DA ÁREA
===================================================== */

function lampPost(
  x,
  z
) {

  const pole =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.07,
        0.07,
        5,
        8
      ),
      metalMat
    );

  pole.position.set(
    x,
    2.5,
    z
  );

  scene.add(pole);


  const head =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        0.28,
        10,
        10
      ),
      new THREE.MeshStandardMaterial({
        color:0xfff3c4,
        emissive:0xfff3c4,
        emissiveIntensity:0.25
      })
    );

  head.position.set(
    x,
    5,
    z
  );

  scene.add(head);
}


lampPost(
  parkX,
  plazaZ + 8
);

lampPost(
  courtCenterX,
  courtCenterZ + 7
);


/* =====================================================
   CONTROLES / RENDER
===================================================== */

function animate() {

  requestAnimationFrame(
    animate
  );

  controls.update();

  renderer.render(
    scene,
    camera
  );
}

animate();


addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

</script>
