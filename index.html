<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>BOX — Controle de Acesso</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  background: #030303;

  color: #fffef2;

  font-family:
    "JetBrains Mono",
    "Courier New",
    monospace;

  text-transform: uppercase;

  letter-spacing: 0.08em;

}

main {

  width: 100%;

  max-width: 900px;

  margin: 0 auto;

  padding: 32px 20px 60px;

}

header {

  margin-bottom: 40px;

  border-bottom: 1px solid #6e6e66;

  padding-bottom: 20px;

}

h1 {

  margin: 0;

  font-size: 32px;

  font-weight: 700;

}

.subtitle {

  margin-top: 10px;

  color: #6e6e66;

  font-size: 14px;

}

section {

  margin-bottom: 32px;

  border: 1px solid #6e6e66;

  padding: 24px;

}

h2 {

  margin-top: 0;

  margin-bottom: 24px;

  font-size: 18px;

  color: #d99a32;

}

label {

  display: block;

  margin-bottom: 8px;

  color: #6e6e66;

  font-size: 13px;

}

input,
textarea {

  width: 100%;

  margin-bottom: 20px;

  padding: 14px;

  border: 1px solid #6e6e66;

  background: #030303;

  color: #fffef2;

  font-family: inherit;

  font-size: 16px;

  letter-spacing: 0.04em;

}

input {

  min-height: 58px;

}

textarea {

  min-height: 280px;

  resize: vertical;

  line-height: 1.6;

}

input:focus,
textarea:focus {

  outline: none;

  border-color: #d99a32;

}

button {

  width: 100%;

  min-height: 64px;

  border: 1px solid #d99a32;

  background: #d99a32;

  color: #030303;

  font-family: inherit;

  font-size: 17px;

  font-weight: 700;

  letter-spacing: 0.08em;

  cursor: pointer;

}

button:hover {

  background: #f1c66a;

}

button:active {

  transform: translateY(1px);

}

#importar {

  border-color: #4cc9f0;

  background: #4cc9f0;

}

#importar:hover {

  background: #7bdcff;

}

.resultado {

  margin-top: 24px;

  padding-top: 24px;

  border-top: 1px solid #6e6e66;

}

.linha {

  display: flex;

  justify-content: space-between;

  gap: 20px;

  padding: 12px 0;

  border-bottom: 1px solid #222;

}

.nome {

  color: #6e6e66;

  font-size: 13px;

}

.valor {

  text-align: right;

  font-size: 14px;

  word-break: break-all;

}

.status {

  margin-top: 20px;

  padding: 20px;

  border: 1px solid #4cc9f0;

  color: #4cc9f0;

  font-size: 16px;

  line-height: 1.6;

}

.log {

  margin-top: 20px;

  color: #f1c66a;

  font-size: 13px;

  line-height: 1.6;

  word-break: break-word;

}

.autorizacoes {

  margin-top: 20px;

  color: #6e6e66;

  font-size: 12px;

  line-height: 1.6;

}

@media (max-width: 600px) {

  main {

    padding: 20px 14px 40px;

  }

  h1 {

    font-size: 25px;

  }

  section {

    padding: 18px;

  }

  .linha {

    display: block;

  }

  .valor {

    margin-top: 6px;

    text-align: left;

  }

  textarea {

    min-height: 320px;

    font-size: 12px;

  }

}

</style>

</head>

<body>

<main>


<header>

<h1>BOX</h1>

<div class="subtitle">
CONTROLE DE ACESSO
</div>

</header>


<!-- =====================================================
     IMPORTAR AUTORIZAÇÃO
===================================================== -->

<section>

<h2>
IMPORTAR AUTORIZAÇÃO
</h2>


<label for="pacote">

PACOTE DE AUTORIZAÇÃO

</label>


<textarea
  id="pacote"
  placeholder="COLE AQUI O PACOTE JSON GERADO PELO GERADOR"
></textarea>


<button
  id="importar"
  onclick="importarPacote()"
>

IMPORTAR AUTORIZAÇÃO

</button>


<div
  class="log"
  id="logImportacao"
>

AGUARDANDO PACOTE

</div>


</section>


<!-- =====================================================
     SOLICITAR ACESSO
===================================================== -->

<section>

<h2>
SOLICITAR ACESSO
</h2>


<label for="sala">

SALA / SETOR

</label>


<input
  id="sala"
  type="text"
  placeholder="EX: _01"
>


<label for="token">

TOKEN

</label>


<input
  id="token"
  type="text"
  placeholder="BOX-..."
>


<button
  onclick="solicitarAcesso()"
>

SOLICITAR ACESSO

</button>


<div
  class="status"
  id="resultadoAcesso"
>

AGUARDANDO SOLICITAÇÃO

</div>


<div
  class="resultado"
  id="dadosAcesso"
  style="display:none;"
>


<div class="linha">

  <div class="nome">
    RESULTADO
  </div>

  <div
    class="valor"
    id="resultado"
  >
    —
  </div>

</div>


<div class="linha">

  <div class="nome">
    SALA
  </div>

  <div
    class="valor"
    id="salaResultado"
  >
    —
  </div>

</div>


<div class="linha">

  <div class="nome">
    AGENTE
  </div>

  <div
    class="valor"
    id="agenteResultado"
  >
    —
  </div>

</div>


<div class="linha">

  <div class="nome">
    EXPIRA
  </div>

  <div
    class="valor"
    id="expiraResultado"
  >
    —
  </div>

</div>


<div class="linha">

  <div class="nome">
    MOTIVO
  </div>

  <div
    class="valor"
    id="motivoResultado"
  >
    —
  </div>

</div>


</div>

</section>


<!-- =====================================================
     TELEMETRIA
===================================================== -->

<section>

<h2>
TELEMETRIA / LOGS
</h2>


<div
  class="autorizacoes"
  id="contadorAutorizacoes"
>

AUTORIZAÇÕES REGISTRADAS: 0

</div>


<div
  class="log"
  id="telemetria"
>

AGUARDANDO EVENTOS

</div>


</section>


</main>


<!-- =====================================================
     VALIDADOR
===================================================== -->

<script src="acesso.js"></script>


<script>


// =====================================================
// IMPORTAR PACOTE
// =====================================================

function importarPacote() {

  const campo =
    document
      .getElementById(
        "pacote"
      );


  const texto =
    campo
      .value
      .trim();


  if (!texto) {

    document
      .getElementById(
        "logImportacao"
      )
      .textContent =
      "PACOTE VAZIO";

    return;

  }


  let pacote;


  try {

    pacote =
      JSON.parse(
        texto
      );

  }

  catch (erro) {

    document
      .getElementById(
        "logImportacao"
      )
      .textContent =
      "ERRO — JSON INVÁLIDO";

    atualizarTelemetria();

    return;

  }


  const resposta =
    importarAutorizacao(
      pacote
    );


  if (
    resposta.resultado ===
    "ALLOW"
  ) {

    document
      .getElementById(
        "logImportacao"
      )
      .textContent =
      "AUTORIZAÇÃO IMPORTADA COM SUCESSO";


    document
      .getElementById(
        "sala"
      )
      .value =
      pacote.sala;


    document
      .getElementById(
        "token"
      )
      .value =
      pacote.token;

  }

  else {

    document
      .getElementById(
        "logImportacao"
      )
      .textContent =
      "IMPORTAÇÃO NEGADA — " +
      resposta.motivo;

  }


  atualizarTelemetria();

}


// =====================================================
// SOLICITAR ACESSO
// =====================================================

function solicitarAcesso() {

  const sala =
    document
      .getElementById(
        "sala"
      )
      .value
      .trim();


  const token =
    document
      .getElementById(
        "token"
      )
      .value
      .trim();


  if (
    !sala ||
    !token
  ) {

    document
      .getElementById(
        "resultadoAcesso"
      )
      .textContent =
      "CAMPO INVÁLIDO — INFORME SALA E TOKEN";

    return;

  }


  const resposta =
    validarAutorizacao(
      sala,
      token
    );


  document
    .getElementById(
      "dadosAcesso"
    )
    .style
    .display =
    "block";


  document
    .getElementById(
      "resultado"
    )
    .textContent =
    resposta.resultado;


  document
    .getElementById(
      "salaResultado"
    )
    .textContent =
    sala;


  document
    .getElementById(
      "motivoResultado"
    )
    .textContent =
    resposta.motivo;


  if (
    resposta.acesso ===
    true
  ) {

    document
      .getElementById(
        "resultadoAcesso"
      )
      .textContent =
      "ALLOW — ACESSO AUTORIZADO";


    document
      .getElementById(
        "agenteResultado"
      )
      .textContent =
      resposta.agente;


    document
      .getElementById(
        "expiraResultado"
      )
      .textContent =
      resposta.expira;

  }

  else {

    document
      .getElementById(
        "resultadoAcesso"
      )
      .textContent =
      "DENY — ACESSO NEGADO";


    document
      .getElementById(
        "agenteResultado"
      )
      .textContent =
      "—";


    document
      .getElementById(
        "expiraResultado"
      )
      .textContent =
      "—";

  }


  atualizarTelemetria();

}


// =====================================================
// ATUALIZAR TELEMETRIA
// =====================================================

function atualizarTelemetria() {

  const autorizacoes =
    consultarAutorizacoes();


  const logs =
    consultarLogs();


  document
    .getElementById(
      "contadorAutorizacoes"
    )
    .textContent =
    "AUTORIZAÇÕES REGISTRADAS: " +
    autorizacoes.length;


  if (
    logs.length === 0
  ) {

    document
      .getElementById(
        "telemetria"
      )
      .textContent =
      "AGUARDANDO EVENTOS";

    return;

  }


  const ultimo =
    logs[
      logs.length - 1
    ];


  document
    .getElementById(
      "telemetria"
    )
    .textContent =

    "ÚLTIMO EVENTO — " +

    ultimo.resultado +

    " — " +

    ultimo.motivo;

}


// =====================================================
// ESTADO INICIAL
// =====================================================

atualizarTelemetria();


</script>

</body>

</html>
