<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOX — Controle de Acesso</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;
      padding: 24px;

      background: #030303;
      color: #fffef2;

      font-family:
        "JetBrains Mono",
        "Courier New",
        monospace;

      letter-spacing: 0.04em;
    }

    .box {

      width: 100%;
      max-width: 760px;

      margin: 0 auto;

      padding: 24px;

      background: #0c0c0a;

      border: 1px solid #6e6e66;

      box-shadow:
        0 0 30px rgba(217, 154, 50, 0.08);
    }

    .cabecalho {

      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 24px;

      border-bottom: 1px solid #6e6e66;

      padding-bottom: 16px;
    }

    .marca {

      color: #d99a32;

      font-size: 24px;

      font-weight: bold;

      letter-spacing: 0.15em;
    }

    .estado {

      color: #4cc9f0;

      font-size: 12px;

      letter-spacing: 0.12em;
    }

    h2 {

      margin-top: 28px;

      color: #f1c66a;

      font-size: 15px;

      letter-spacing: 0.12em;
    }

    label {

      display: block;

      margin-top: 16px;
      margin-bottom: 7px;

      color: #6e6e66;

      font-size: 12px;

      text-transform: uppercase;
    }

    input,
    select {

      width: 100%;

      padding: 13px;

      background: #030303;

      color: #fffef2;

      border: 1px solid #6e6e66;

      border-radius: 0;

      outline: none;

      font-family: inherit;

      font-size: 15px;
    }

    input:focus,
    select:focus {

      border-color: #d99a32;

      box-shadow:
        0 0 10px rgba(217, 154, 50, 0.15);
    }

    button {

      width: 100%;

      margin-top: 20px;

      padding: 14px;

      background: #d99a32;

      color: #030303;

      border: 0;

      border-radius: 0;

      font-family: inherit;

      font-weight: bold;

      letter-spacing: 0.12em;

      cursor: pointer;
    }

    button:hover {

      background: #f1c66a;
    }

    .painel {

      margin-top: 20px;

      padding: 16px;

      background: #030303;

      border: 1px solid #6e6e66;
    }

    .linha {

      display: flex;

      justify-content: space-between;

      gap: 20px;

      padding: 7px 0;

      border-bottom: 1px solid rgba(110,110,102,0.25);

      font-size: 13px;
    }

    .linha:last-child {
      border-bottom: 0;
    }

    .chave {
      color: #6e6e66;
    }

    .valor {
      color: #fffef2;
      text-align: right;
      word-break: break-word;
    }

    #resultado {

      margin-top: 20px;

      padding: 16px;

      border: 1px solid #6e6e66;

      color: #f1c66a;

      min-height: 50px;
    }

    #logs {

      margin-top: 12px;

      padding: 16px;

      background: #030303;

      border: 1px solid #6e6e66;

      color: #4cc9f0;

      white-space: pre-wrap;

      word-break: break-word;

      overflow-x: auto;

      font-size: 12px;

      line-height: 1.6;
    }

    .separador {

      margin: 28px 0;

      border: 0;

      border-top: 1px solid #6e6e66;
    }

    .aviso {

      margin-top: 10px;

      color: #6e6e66;

      font-size: 11px;

      line-height: 1.6;
    }

  </style>

</head>


<body>

  <main class="box">


    <!-- CABEÇALHO -->

    <header class="cabecalho">

      <div class="marca">
        BOX
      </div>

      <div class="estado">
        CAMPO ATIVO
      </div>

    </header>


    <!-- REGISTRO -->

    <h2>
      REGISTRAR AUTORIZAÇÃO
    </h2>


    <label for="agente">
      Agente
    </label>

    <input
      id="agente"
      type="text"
      placeholder="Ex.: ChatGPT"
    >


    <label for="sala">
      Sala / Setor
    </label>

    <input
      id="sala"
      type="text"
      value="_01"
      placeholder="_01"
    >


    <label for="token">
      Código de autorização
    </label>

    <input
      id="token"
      type="text"
      placeholder="BOX-..."
    >


    <label for="validade">
      Validade em horas
    </label>

    <input
      id="validade"
      type="number"
      value="24"
      min="1"
    >


    <button onclick="registrar()">
      REGISTRAR AUTORIZAÇÃO
    </button>


    <div class="aviso">

      Esta etapa registra temporariamente a autorização
      na memória desta página.

    </div>


    <!-- AUTORIZAÇÃO REGISTRADA -->

    <section class="painel">

      <div class="linha">

        <span class="chave">
          ESTADO
        </span>

        <span
          class="valor"
          id="estadoRegistro"
        >
          AGUARDANDO
        </span>

      </div>


      <div class="linha">

        <span class="chave">
          AGENTE
        </span>

        <span
          class="valor"
          id="agenteRegistro"
        >
          —
        </span>

      </div>


      <div class="linha">

        <span class="chave">
          SALA
        </span>

        <span
          class="valor"
          id="salaRegistro"
        >
          —
        </span>

      </div>


      <div class="linha">

        <span class="chave">
          EXPIRA
        </span>

        <span
          class="valor"
          id="expiraRegistro"
        >
          —
        </span>

      </div>

    </section>


    <hr class="separador">


    <!-- ACESSO -->

    <h2>
      SOLICITAR ACESSO
    </h2>


    <label for="salaAcesso">
      Sala / Setor
    </label>

    <input
      id="salaAcesso"
      type="text"
      value="_01"
      placeholder="_01"
    >


    <label for="tokenAcesso">
      Código de autorização
    </label>

    <input
      id="tokenAcesso"
      type="text"
      placeholder="BOX-..."
    >


    <button onclick="testarAcesso()">
      SOLICITAR ACESSO
    </button>


    <div id="resultado">
      AGUARDANDO SOLICITAÇÃO
    </div>


    <hr class="separador">


    <!-- LOGS -->

    <h2>
      TELEMETRIA / LOGS
    </h2>


    <pre id="logs">Nenhum evento registrado.</pre>


  </main>


  <!-- MOTOR DO BOX -->

  <script src="acesso.js"></script>


  <!-- INTERFACE -->

  <script>

    function registrar() {

      const agente =
        document
          .getElementById("agente")
          .value
          .trim();

      const sala =
        document
          .getElementById("sala")
          .value
          .trim();

      const token =
        document
          .getElementById("token")
          .value
          .trim();

      const validade =
        Number(
          document
            .getElementById("validade")
            .value
        );


      if (
        !agente ||
        !sala ||
        !token ||
        !validade ||
        validade <= 0
      ) {

        document
          .getElementById("estadoRegistro")
          .textContent =
          "CAMPO INVÁLIDO";

        return;
      }


      const criado =
        new Date();


      const expira =
        new Date(
          criado.getTime() +
          validade *
          60 *
          60 *
          1000
        );


      const autorizacao = {

        token: token,

        agente: agente,

        sala: sala,

        criado:
          criado.toISOString(),

        expira:
          expira.toISOString()

      };


      registrarAutorizacao(
        autorizacao
      );


      document
        .getElementById("estadoRegistro")
        .textContent =
        "REGISTRADO";


      document
        .getElementById("agenteRegistro")
        .textContent =
        agente;


      document
        .getElementById("salaRegistro")
        .textContent =
        sala;


      document
        .getElementById("expiraRegistro")
        .textContent =
        expira.toLocaleString(
          "pt-BR"
        );


      atualizarLogs();

    }


    function testarAcesso() {

      const sala =
        document
          .getElementById("salaAcesso")
          .value
          .trim();


      const token =
        document
          .getElementById("tokenAcesso")
          .value
          .trim();


      if (!sala || !token) {

        document
          .getElementById("resultado")
          .textContent =
          "CAMPO INVÁLIDO — INFORME SALA E TOKEN";

        return;
      }


      const resposta =
        validarAutorizacao(
          sala,
          token
        );


      if (resposta.acesso) {

        document
          .getElementById("resultado")
          .textContent =
          "ALLOW — ACESSO AUTORIZADO";

      } else {

        document
          .getElementById("resultado")
          .textContent =
          resposta.resultado +
          " — " +
          resposta.motivo;

      }


      atualizarLogs();

    }


    function atualizarLogs() {

      const logs =
        consultarLogs();


      if (!logs.length) {

        document
          .getElementById("logs")
          .textContent =
          "Nenhum evento registrado.";

        return;

      }


      document
        .getElementById("logs")
        .textContent =
        JSON.stringify(
          logs,
          null,
          2
        );

    }

  </script>

</body>

</html>
