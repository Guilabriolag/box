<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOX — Controle de Acesso</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background: #030303;

      color: #fffef2;

      font-family:
        "JetBrains Mono",
        "Courier New",
        monospace;
    }

    .box {

      width: 100%;

      max-width: 760px;

      margin: 0 auto;

      padding: 24px;
    }

    /* CABEÇALHO */

    header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 12px 0 20px;

      border-bottom: 1px solid #6e6e66;

      margin-bottom: 30px;
    }

    .logo {

      font-size: 32px;

      font-weight: bold;

      letter-spacing: 0.16em;

      color: #d99a32;
    }

    .campo {

      font-size: 13px;

      letter-spacing: 0.12em;

      color: #4cc9f0;
    }

    /* TÍTULOS */

    .titulo {

      margin-bottom: 22px;

      font-size: 22px;

      font-weight: bold;

      letter-spacing: 0.08em;

      color: #f1c66a;
    }

    /* CAMPOS */

    .campo-form {

      margin-bottom: 20px;
    }

    label {

      display: block;

      margin-bottom: 8px;

      font-size: 13px;

      letter-spacing: 0.12em;

      color: #6e6e66;
    }

    input,
    select {

      width: 100%;

      min-height: 56px;

      padding: 14px 16px;

      border: 1px solid #6e6e66;

      border-radius: 0;

      outline: none;

      background: #0a0a09;

      color: #fffef2;

      font-family: inherit;

      font-size: 18px;
    }

    input:focus,
    select:focus {

      border-color: #d99a32;

      box-shadow:
        0 0 14px rgba(217, 154, 50, 0.12);
    }

    /* VALIDADE */

    .validade {

      display: grid;

      grid-template-columns: 1fr 1.4fr;

      gap: 12px;
    }

    /* BOTÕES */

    button {

      width: 100%;

      min-height: 62px;

      margin-top: 6px;

      padding: 14px;

      border: 0;

      border-radius: 0;

      background: #d99a32;

      color: #030303;

      font-family: inherit;

      font-size: 16px;

      font-weight: bold;

      letter-spacing: 0.10em;

      cursor: pointer;
    }

    button:hover {

      background: #f1c66a;
    }

    button:active {

      transform: translateY(1px);
    }

    /* PAINEL */

    .painel {

      margin-top: 20px;

      padding: 18px;

      border: 1px solid #6e6e66;

      background: #080807;
    }

    .linha {

      display: flex;

      justify-content: space-between;

      gap: 20px;

      padding: 10px 0;

      border-bottom:
        1px solid
        rgba(110, 110, 102, 0.25);

      font-size: 14px;
    }

    .linha:last-child {

      border-bottom: 0;
    }

    .chave {

      color: #6e6e66;
    }

    .valor {

      color: #fffef2;

      text-align: right;

      word-break: break-word;
    }

    /* RESULTADO */

    #resultado {

      margin-top: 22px;

      min-height: 90px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      border: 1px solid #6e6e66;

      text-align: center;

      font-size: 20px;

      font-weight: bold;

      letter-spacing: 0.06em;

      color: #f1c66a;
    }

    /* LOG */

    #logs {

      margin: 0;

      padding: 18px;

      min-height: 120px;

      overflow-x: auto;

      background: #050505;

      border: 1px solid #6e6e66;

      color: #4cc9f0;

      white-space: pre-wrap;

      word-break: break-word;

      font-family: inherit;

      font-size: 12px;

      line-height: 1.6;
    }

    /* SEPARADOR */

    .separador {

      margin: 42px 0;

      border: 0;

      border-top: 1px solid #6e6e66;
    }

    /* TEXTO AUXILIAR */

    .auxiliar {

      margin-top: 10px;

      color: #6e6e66;

      font-size: 11px;

      line-height: 1.6;
    }

    /* MOBILE */

    @media (max-width: 520px) {

      .box {

        padding: 18px;
      }

      .logo {

        font-size: 27px;
      }

      .campo {

        font-size: 10px;
      }

      .titulo {

        font-size: 19px;
      }

      .validade {

        grid-template-columns: 1fr;
      }

      input,
      select {

        min-height: 58px;

        font-size: 17px;
      }

      button {

        min-height: 64px;

        font-size: 15px;
      }

      #resultado {

        font-size: 17px;
      }
    }

  </style>

</head>


<body>


  <main class="box">


    <!-- CABEÇALHO -->

    <header>

      <div class="logo">
        BOX
      </div>

      <div class="campo">
        CAMPO ATIVO
      </div>

    </header>


    <!-- REGISTRO -->

    <section>

      <div class="titulo">
        REGISTRAR AUTORIZAÇÃO
      </div>


      <div class="campo-form">

        <label for="agente">
          AGENTE
        </label>

        <input
          id="agente"
          type="text"
          placeholder="Ex.: ChatGPT"
        >

      </div>


      <div class="campo-form">

        <label for="sala">
          SALA / SETOR
        </label>

        <input
          id="sala"
          type="text"
          value="_01"
          placeholder="_01"
        >

      </div>


      <div class="campo-form">

        <label for="token">
          CÓDIGO DE AUTORIZAÇÃO
        </label>

        <input
          id="token"
          type="text"
          placeholder="BOX-..."
        >

      </div>


      <div class="campo-form">

        <label>
          VALIDADE
        </label>

        <div class="validade">

          <input
            id="validade"
            type="number"
            value="10"
            min="0.001"
            step="any"
          >

          <select id="unidade">

            <option value="segundos">
              SEGUNDOS
            </option>

            <option value="minutos">
              MINUTOS
            </option>

            <option value="horas">
              HORAS
            </option>

            <option value="dias">
              DIAS
            </option>

          </select>

        </div>

      </div>


      <button onclick="registrar()">
        REGISTRAR AUTORIZAÇÃO
      </button>


      <div class="auxiliar">

        A autorização será mantida na memória
        enquanto esta página estiver aberta.

      </div>


      <div class="painel">

        <div class="linha">

          <span class="chave">
            ESTADO
          </span>

          <span
            class="valor"
            id="estadoRegistro"
          >
            AGUARDANDO
          </span>

        </div>


        <div class="linha">

          <span class="chave">
            AGENTE
          </span>

          <span
            class="valor"
            id="agenteRegistro"
          >
            —
          </span>

        </div>


        <div class="linha">

          <span class="chave">
            SALA
          </span>

          <span
            class="valor"
            id="salaRegistro"
          >
            —
          </span>

        </div>


        <div class="linha">

          <span class="chave">
            EXPIRA
          </span>

          <span
            class="valor"
            id="expiraRegistro"
          >
            —
          </span>

        </div>

      </div>

    </section>


    <hr class="separador">


    <!-- ACESSO -->

    <section>

      <div class="titulo">
        SOLICITAR ACESSO
      </div>


      <div class="campo-form">

        <label for="salaAcesso">
          SALA / SETOR
        </label>

        <input
          id="salaAcesso"
          type="text"
          value="_01"
          placeholder="_01"
        >

      </div>


      <div class="campo-form">

        <label for="tokenAcesso">
          CÓDIGO DE AUTORIZAÇÃO
        </label>

        <input
          id="tokenAcesso"
          type="text"
          placeholder="BOX-..."
        >

      </div>


      <button onclick="testarAcesso()">
        SOLICITAR ACESSO
      </button>


      <div id="resultado">
        AGUARDANDO SOLICITAÇÃO
      </div>

    </section>


    <hr class="separador">


    <!-- TELEMETRIA -->

    <section>

      <div class="titulo">
        TELEMETRIA / LOGS
      </div>

      <pre id="logs">Nenhum evento registrado.</pre>

    </section>


  </main>


  <!-- MOTOR DO BOX -->

  <script src="acesso.js"></script>


  <!-- INTERFACE -->

  <script>


    function calcularExpiracao(
      valor,
      unidade
    ) {

      const agora = new Date();

      let milissegundos = 0;


      if (unidade === "segundos") {

        milissegundos =
          valor * 1000;

      }


      if (unidade === "minutos") {

        milissegundos =
          valor * 60 * 1000;

      }


      if (unidade === "horas") {

        milissegundos =
          valor * 60 * 60 * 1000;

      }


      if (unidade === "dias") {

        milissegundos =
          valor * 24 * 60 * 60 * 1000;

      }


      return new Date(
        agora.getTime() +
        milissegundos
      );

    }


    function registrar() {


      const agente =
        document
          .getElementById("agente")
          .value
          .trim();


      const sala =
        document
          .getElementById("sala")
          .value
          .trim();


      const token =
        document
          .getElementById("token")
          .value
          .trim();


      const validade =
        Number(
          document
            .getElementById("validade")
            .value
        );


      const unidade =
        document
          .getElementById("unidade")
          .value;


      if (
        !agente ||
        !sala ||
        !token ||
        !validade ||
        validade <= 0
      ) {

        document
          .getElementById(
            "estadoRegistro"
          )
          .textContent =
          "CAMPO INVÁLIDO";

        return;

      }


      const criado =
        new Date();


      const expira =
        calcularExpiracao(
          validade,
          unidade
        );


      const autorizacao = {

        token: token,

        agente: agente,

        sala: sala,

        criado:
          criado.toISOString(),

        expira:
          expira.toISOString()

      };


      registrarAutorizacao(
        autorizacao
      );


      document
        .getElementById(
          "estadoRegistro"
        )
        .textContent =
        "REGISTRADO";


      document
        .getElementById(
          "agenteRegistro"
        )
        .textContent =
        agente;


      document
        .getElementById(
          "salaRegistro"
        )
        .textContent =
        sala;


      document
        .getElementById(
          "expiraRegistro"
        )
        .textContent =
        expira.toLocaleString(
          "pt-BR"
        );


      atualizarLogs();

    }


    function testarAcesso() {


      const sala =
        document
          .getElementById(
            "salaAcesso"
          )
          .value
          .trim();


      const token =
        document
          .getElementById(
            "tokenAcesso"
          )
          .value
          .trim();


      if (!sala || !token) {

        document
          .getElementById(
            "resultado"
          )
          .textContent =
          "CAMPO INVÁLIDO";

        return;

      }


      const resposta =
        validarAutorizacao(
          sala,
          token
        );


      if (resposta.acesso) {

        document
          .getElementById(
            "resultado"
          )
          .textContent =
          "ALLOW — ACESSO AUTORIZADO";

      } else {

        document
          .getElementById(
            "resultado"
          )
          .textContent =
          resposta.resultado +
          " — " +
          resposta.motivo;

      }


      atualizarLogs();

    }


    function atualizarLogs() {


      const logs =
        consultarLogs();


      if (!logs.length) {

        document
          .getElementById(
            "logs"
          )
          .textContent =
          "Nenhum evento registrado.";

        return;

      }


      document
        .getElementById(
          "logs"
        )
        .textContent =
        JSON.stringify(
          logs,
          null,
          2
        );

    }


  </script>


</body>

</html>
