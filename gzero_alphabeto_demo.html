<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gzero — Demo</title><style>:root{font-family:system-ui;background:#0b1020;color:#eef2ff}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:1050px;margin:auto}.card{background:#121a30;border:1px solid #263452;border-radius:16px;padding:18px;margin:14px 0}h1{font-size:25px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}.sub{color:#aab7d4;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}label{font-size:12px;color:#91a1c4;display:block;margin-bottom:5px}input,button{width:100%;padding:11px;border-radius:10px;border:1px solid #334365;background:#0d1427;color:#fff}button{cursor:pointer;font-weight:700}.buttons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.buttons button{font-size:17px}.primary{background:#253a70}.danger{background:#542c45}.manifest{display:flex;align-items:center;gap:18px;min-height:130px}.glyph{width:95px;height:95px;border-radius:24px;display:grid;place-items:center;font-size:42px;font-weight:800;transition:.35s;box-shadow:0 0 30px #0008}.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-family:ui-monospace,monospace;font-size:13px}.pill{padding:4px 8px;border-radius:999px;background:#202b49}pre{white-space:pre-wrap;word-break:break-word;margin:0;color:#c9d5ef;font-size:12px}.log{max-height:260px;overflow:auto}.ok{color:#75e6a3}.warn{color:#ffd27a}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.buttons{grid-template-columns:repeat(3,1fr)}.manifest{align-items:flex-start;flex-direction:column}.meta{width:100%}}</style></head><body><div class="wrap"><div class="card"><h1>Gzero / Alph@beto — Demo 01</h1><div class="sub">Teste: mesma entrada → mesma manifestação; mudar IDTIME/KEY → nova resolução.</div><div class="grid"><div><label>ENTITY</label><input id="entity" value="X"></div><div><label>SPACE</label><input id="space" value="S01"></div><div><label>IDTIME</label><input id="time" value="T01"></div><div><label>KEY</label><input id="key" value="K01"></div></div></div><div class="card"><h2>Fragmento / distinção</h2><div class="buttons" id="fragBtns"></div></div><div class="card"><h2>Manifestação observada</h2><div class="manifest"><div class="glyph" id="glyph">?</div><div style="flex:1"><div id="meaning" style="font-size:18px;font-weight:800;margin-bottom:10px">Aguardando observação</div><div class="meta"><div>FRAGMENTO <span class="pill" id="mfrag">—</span></div><div>REPRESENTAÇÃO <span class="pill" id="rep">—</span></div><div>OBSERVER <span class="pill">WA01</span></div><div>RESOLVER <span class="pill">WB01</span></div></div></div></div></div><div class="card"><h2>Reprodutibilidade</h2><div class="grid"><button class="primary" onclick="repeatTest()">Repetir 100×</button><button onclick="changeTime()">Mudar somente IDTIME</button><button onclick="changeKey()">Mudar somente KEY</button><button class="danger" onclick="clearLog()">Limpar</button></div><p id="result" class="ok">Nenhum teste executado.</p></div><div class="card"><h2>Cadeia de eventos</h2><pre id="log"></pre></div></div><script>const fragments=["01","02","03","09","11","12","13","31","32","33"];const symbols=["@","#","%","&","A","B","C","1","2","3"];function fnv1a(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}function resolve(fragment){const e=entity.value,s=space.value,t=time.value,k=key.value,h=fnv1a(`${e}|${s}|${t}|${k}|${fragment}`),idx=h%symbols.length;return{rep:h.toString(16).padStart(8,"0"),symbol:symbols[idx],hue:h%360,light:42+h%18,state:h&1?"STATE 1":"STATE 0"}}function observe(f,add=true){const r=resolve(f);glyph.textContent=r.symbol;glyph.style.background=`hsl(${r.hue} 65% ${r.light}%)`;glyph.style.boxShadow=`0 0 34px hsl(${r.hue} 70% 55% / .45)`;meaning.textContent=`${r.state} · manifestação determinística`;mfrag.textContent=f;rep.textContent=r.rep;if(add)addLog(`OBSERVATION fragment=${f} → ${r.rep} → ${r.symbol} (${r.state})`);return r}function addLog(x){log.textContent+=x+"\n";log.scrollTop=999999}function repeatTest(){const f=mfrag.textContent==="—"?"01":mfrag.textContent,first=resolve(f).rep;same=[...Array(100)].every(()=>resolve(f).rep===first);result.innerHTML=same?'<span class="ok">✓ 100/100 iguais. Entrada determinística.</span>':'<span class="warn">⚠ Divergência encontrada.</span>';addLog(`TEST 100× fragment=${f} → ${same?"PASS":"FAIL"}`)}function changeTime(){const old=time.value;time.value=old==="T01"?"T02":"T01";observe(mfrag.textContent==="—"?"01":mfrag.textContent);addLog(`IDTIME: ${old} → ${time.value}`)}function changeKey(){const old=key.value;key.value=old==="K01"?"K02":"K01";observe(mfrag.textContent==="—"?"01":mfrag.textContent);addLog(`KEY: ${old} → ${key.value}`)}function clearLog(){log.textContent="";result.textContent="Nenhum teste executado."}fragments.forEach(f=>{const b=document.createElement("button");b.textContent=f;b.onclick=()=>observe(f);fragBtns.appendChild(b)});observe("01",false)</script></body></html>
