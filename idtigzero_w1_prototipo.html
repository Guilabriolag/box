<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gzero — W1</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101114;color:#f4f4f5;font-family:system-ui,sans-serif;display:grid;place-items:center}.app{width:min(520px,94vw);padding:24px}h1{margin:0 0 6px}.sub{opacity:.65;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}button{min-height:64px;border:1px solid #34363d;border-radius:14px;background:#1b1d22;color:white;font-size:22px;cursor:pointer}button.selected{outline:2px solid white;background:#30333b}.redeem{width:100%;margin-top:18px;min-height:58px;background:#f4f4f5;color:#101114;font-size:18px}.status{margin-top:18px;padding:14px;border:1px solid #34363d;border-radius:12px;min-height:52px}.hidden{display:none!important}#splash{position:fixed;inset:0;background:#101114;display:grid;place-items:center;text-align:center}.pulse{width:90px;height:90px;border:4px solid #eee;border-radius:50%;margin:auto auto 20px;animation:pulse 1.1s infinite ease-in-out}@keyframes pulse{0%,100%{transform:scale(.75);opacity:.35}50%{transform:scale(1);opacity:1}}.event{font-family:monospace;opacity:.65;margin-top:10px}
</style>
</head>
<body>
<main class="app" id="main">
<h1>Gzero / W1</h1>
<div class="sub">seleção → pedido → 1 sat → confirmação → evento</div>
<div class="grid" id="buttons">
<button data-value="A">A</button><button data-value="B">B</button><button data-value="C">C</button>
<button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button>
<button data-value="@">@</button><button data-value="%">%</button><button data-value="#">#</button>
<button data-value="*">*</button><button data-value="&">&amp;</button><button data-value="...">...</button>
</div>
<button class="redeem" id="redeem">RESGATAR</button>
<div class="status" id="status">Selecione um botão. Ex.: @</div>
</main>

<section id="splash" class="hidden">
<div><div class="pulse"></div><h2>W1 confirmou</h2><div id="result"></div><div class="event" id="eventId"></div></div>
</section>

<script>
const state={selected:null,worker:"W1",amountSat:1};
const status=document.getElementById("status");
document.querySelectorAll("#buttons button").forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll("#buttons button").forEach(b=>b.classList.remove("selected"));
  btn.classList.add("selected"); state.selected=btn.dataset.value;
  status.textContent=`Seleção: ${state.selected} → ${state.worker} → ${state.amountSat} sat`;
 };
});
document.getElementById("redeem").onclick=async()=>{
 if(!state.selected){status.textContent="Selecione primeiro um botão.";return;}
 status.textContent=`Gerando pedido de ${state.amountSat} sat para ${state.worker}…`;
 await sleep(900);
 status.textContent="Pedido criado. Aguardando confirmação…";
 await sleep(1600);
 const idtime=new Date().toISOString();
 document.getElementById("result").textContent=`${state.selected} → ${state.amountSat} sat → ${state.worker}`;
 document.getElementById("eventId").textContent=`IDTIME ${idtime}`;
 document.getElementById("splash").classList.remove("hidden");
};
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
</script>
</body>
</html>
