<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Editor de Território — Sandbox 2D</title>
<style>
  :root{
    --bg:#0b0e14;
    --grid:#1c2433;
    --grid-strong:#2a3550;
    --accent:#5fd0a0;
    --accent-dim:#5fd0a022;
    --ink:#c9d3e0;
    --ink-dim:#6c7891;
    --panel:#10141ce8;
    --danger:#e0705f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); overflow:hidden;
    font-family:'SF Mono', 'JetBrains Mono', monospace;
    color:var(--ink); touch-action:none;
  }
  canvas{ position:fixed; inset:0; display:block; width:100%; height:100%; }

  /* HUD Superior */
  #hud-top{
    position:fixed; top:0; left:0; right:0;
    padding:max(12px, env(safe-area-inset-top)) 16px 10px;
    display:flex; justify-content:space-between; align-items:center;
    pointer-events:none; z-index:20;
  }
  .hud-box{
    background:var(--panel); border:1px solid var(--grid-strong);
    padding:8px 12px; border-radius:8px; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase; pointer-events:auto;
    backdrop-filter:blur(6px);
  }
  .hud-box b{ color:var(--accent); }

  /* Barra de Ferramentas Inferior (Estilo The Sims / Construtor) */
  #toolbar{
    position:fixed; bottom:max(16px, env(safe-area-inset-bottom)); left:50%;
    transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--grid-strong);
    padding:8px; border-radius:14px; display:flex; gap:6px;
    z-index:20; pointer-events:auto; backdrop-filter:blur(8px);
    max-width:96vw; overflow-x:auto;
  }
  .tool-btn{
    background:none; border:1px solid transparent; color:var(--ink-dim);
    font-family:inherit; font-size:10px; text-transform:uppercase;
    padding:8px 10px; border-radius:8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    white-space:nowrap; transition:all .15s ease;
  }
  .tool-btn span{ font-size:16px; }
  .tool-btn:hover{ color:var(--ink); border-color:var(--grid-strong); }
  .tool-btn.active{
    background:var(--accent-dim); border-color:var(--accent); color:var(--accent);
  }

  /* Painel Lateral / JSON */
  #side-panel{
    position:fixed; top:0; right:0; width:min(280px, 80vw); height:100%;
    background:var(--panel); border-left:1px solid var(--grid-strong);
    padding:max(20px, env(safe-area-inset-top)) 16px 16px;
    display:flex; flex-direction:column; z-index:30;
    transform:translateX(100%); transition:transform .25s ease;
    backdrop-filter:blur(8px); pointer-events:auto;
  }
  #side-panel.open{ transform:translateX(0); }
  #side-panel h3{ font-size:12px; letter-spacing:.1em; color:var(--ink-dim); margin:0 0 12px; }
  .action-row{ display:flex; gap:8px; margin-bottom:12px; }
  .action-btn{
    flex:1; background:none; border:1px solid var(--grid-strong);
    color:var(--ink); font-family:inherit; font-size:10px;
    padding:8px; border-radius:6px; cursor:pointer; text-transform:uppercase;
  }
  .action-btn:hover{ border-color:var(--accent); color:var(--accent); }
  #entity-list{ flex:1; overflow-y:auto; border-top:1px solid var(--grid); padding-top:8px; }
  .list-item{
    display:flex; justify-content:space-between; align-items:center;
    font-size:11px; padding:6px 0; border-bottom:1px solid #ffffff05;
  }
  .list-item button{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:11px; }

  #toggle-panel{
    position:fixed; top:max(12px, env(safe-area-inset-top)); right:16px;
    z-index:25; pointer-events:auto;
  }

  #toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--panel); border:1px solid var(--grid-strong); padding:8px 14px;
    border-radius:6px; font-size:11px; opacity:0; transition:opacity .2s, transform .2s;
    pointer-events:none; z-index:40;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<canvas ideditor></canvas>

<div id="hud-top">
  <div class="hud-box">Ferramenta: <b id="current-tool-label">Cursor / Seleção</b></div>
</div>

<button class="action-btn" id="toggle-panel" style="width:auto; padding:8px 12px;">📁 Painel & JSON</button>

<div id="toolbar">
  <button class="tool-btn active" data-tool="cursor"><span>👆</span>Cursor</button>
  <button class="tool-btn" data-tool="caixa"><span>📦</span>Caixa</button>
  <button class="tool-btn" data-tool="porta"><span>🚪</span>Porta</button>
  <button class="tool-btn" data-tool="npc"><span>🧍</span>NPC</button>
  <button class="tool-btn" data-tool="residencia"><span>🏠</span>Residência</button>
  <button class="tool-btn" data-tool="comercio"><span>🏬</span>Comércio</button>
  <button class="tool-btn" data-tool="industria"><span>🏭</span>Indústria</button>
  <button class="tool-btn" data-tool="servicos"><span>🏛️</span>Serviços</button>
  <button class="tool-btn" data-tool="apagar"><span>🗑️</span>Apagar</button>
</div>

<div id="side-panel">
  <h3>Gerenciamento do Território</h3>
  <div class="action-row">
    <button class="action-btn" id="btn-export">Salvar JSON</button>
    <button class="action-btn" id="btn-import">Carregar JSON</button>
  </div>
  <div class="action-row">
    <button class="action-btn" id="btn-clear" style="color:var(--danger); border-color:var(--danger)">Limpar Tudo</button>
  </div>
  <h3>Entidades no Mapa</h3>
  <div id="entity-list"></div>
  <button class="action-btn" id="btn-close-panel" style="margin-top:8px;">Fechar Painel</button>
</div>

<div id="toast"></div>

<script>
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;
function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Estado da Câmera (Pan e Zoom)
const camera = { x: 0, y: 0, zoom: 1 };
const TILE_SIZE = 40; // Tamanho base da célula do grid

// Tipos de Entidades e seus visuais no editor 2D (Planta baixa limpa)
const TYPES = {
  caixa:      { label: 'Caixa / Objeto', color: '#e0a45f', w: 1, h: 1 },
  porta:      { label: 'Porta',          color: '#5fa0e0', w: 1, h: 1 },
  npc:        { label: 'NPC',            color: '#c95fe0', w: 1, h: 1 },
  residencia: { label: 'Residência',     color: '#5fd0a0', w: 2, h: 2 },
  comercio:   { label: 'Comércio',       color: '#e0705f', w: 3, h: 2 },
  industria:  { label: 'Indústria',      color: '#d4af37', w: 3, h: 3 },
  servicos:   { label: 'Serviços',       color: '#64c4ed', w: 2, h: 3 }
};

let entities = [];
let activeTool = 'cursor';
let selectedEntity = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ------------------------------------------------------------
// RENDERIZAÇÃO DO EDITOR (Planta Baixa 2D Limpa)
// ------------------------------------------------------------
function draw() {
  ctx.fillStyle = '#0b0e14';
  ctx.fillRect(0, 0, width, height);

  ctx.save();
  ctx.translate(width / 2 + camera.x, height / 2 + camera.y);
  ctx.scale(camera.zoom, camera.zoom);

  // Desenhar Grid Modular
  const gridRange = 15;
  ctx.strokeStyle = '#1c2433';
  ctx.lineWidth = 1 / camera.zoom;

  for (let x = -gridRange; x <= gridRange; x++) {
    for (let y = -gridRange; y <= gridRange; y++) {
      const px = x * TILE_SIZE;
      const py = y * TILE_SIZE;
      ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
    }
  }

  // Eixos centrais
  ctx.strokeStyle = '#2a3550';
  ctx.beginPath();
  ctx.moveTo(-gridRange * TILE_SIZE, 0); ctx.lineTo(gridRange * TILE_SIZE, 0);
  ctx.moveTo(0, -gridRange * TILE_SIZE); ctx.lineTo(0, gridRange * TILE_SIZE);
  ctx.stroke();

  // Desenhar Entidades
  entities.forEach((ent, idx) => {
    const def = TYPES[ent.type];
    const px = ent.gx * TILE_SIZE;
    const py = ent.gy * TILE_SIZE;
    const pw = def.w * TILE_SIZE;
    const ph = def.h * TILE_SIZE;

    ctx.fillStyle = def.color + '33'; // Fundo translúcido
    ctx.fillRect(px, py, pw, ph);

    ctx.strokeStyle = def.color;
    ctx.lineWidth = (selectedEntity === idx ? 3 : 1.5) / camera.zoom;
    ctx.strokeRect(px, py, pw, ph);

    // Texto descritivo na planta
    ctx.fillStyle = '#c9d3e0';
    ctx.font = `${Math.max(9, 11 / camera.zoom)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(def.label, px + pw / 2, py + ph / 2 + 3);
  });

  ctx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ------------------------------------------------------------
// INTERAÇÃO DO MOUSE / TOQUE (Pan e Spawn / Edição)
// ------------------------------------------------------------
let isDragging = false;
let startX = 0, startY = 0;
let hasMoved = false;

canvas.addEventListener('pointerdown', e => {
  isDragging = true;
  hasMoved = false;
  startX = e.clientX;
  startY = e.clientY;
});

canvas.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  if (Math.hypot(dx, dy) > 4) hasMoved = true;

  if (activeTool === 'cursor' && hasMoved) {
    camera.x += dx;
    camera.y += dy;
  }
  startX = e.clientX;
  startY = e.clientY;
});

canvas.addEventListener('pointerup', e => {
  isDragging = false;
  if (!hasMoved) {
    // Clique isolado: converter coordenadas de tela para Grid
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX - rect.left;
    const clientY = e.clientY - rect.top;

    const worldX = clientX - (width / 2 + camera.x);
    const worldY = clientY - (height / 2 + camera.y);

    const gx = Math.floor(worldX / (TILE_SIZE * camera.zoom));
    const gy = Math.floor(worldY / (TILE_SIZE * camera.zoom));

    handleMapClick(gx, gy);
  }
});

// Zoom com scroll do mouse
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const zoomFactor = 1.1;
  if (e.deltaY < 0) {
    camera.zoom = Math.min(camera.zoom * zoomFactor, 2.5);
  } else {
    camera.zoom = Math.max(camera.zoom / zoomFactor, 0.4);
  }
}, { passive: false });

// ------------------------------------------------------------
// LÓGICA DE FERRAMENTAS
// ------------------------------------------------------------
function handleMapClick(gx, gy) {
  if (activeTool === 'cursor') {
    // Selecionar entidade se houver alguma na coordenada
    const foundIdx = entities.findIndex(ent => {
      const def = TYPES[ent.type];
      return gx >= ent.gx && gx < ent.gx + def.w && gy >= ent.gy && gy < ent.gy + def.h;
    });
    selectedEntity = foundIdx !== -1 ? foundIdx : null;
    if (selectedEntity !== null) {
      showToast(`Selecionado: ${TYPES[entities[selectedEntity].type].label}`);
    }
  } else if (activeTool === 'apagar') {
    const foundIdx = entities.findIndex(ent => {
      const def = TYPES[ent.type];
      return gx >= ent.gx && gx < ent.gx + def.w && gy >= ent.gy && gy < ent.gy + def.h;
    });
    if (foundIdx !== -1) {
      entities.splice(foundIdx, 1);
      updateEntityList();
      showToast('Entidade removida.');
    }
  } else {
    // Spawnar nova entidade do tipo ativo
    const def = TYPES[activeTool];
    entities.push({ type: activeTool, gx, gy });
    updateEntityList();
    showToast(`${def.label} posicionado em (${gx}, ${gy})`);
  }
}

// ------------------------------------------------------------
// UI E PAINEL LATERAL
// ------------------------------------------------------------
document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTool = btn.dataset.tool;
    document.getElementById('current-tool-label').textContent = btn.textContent.trim().replace(/^[\p{Emoji}\s]+/u, '');
  });
});

const sidePanel = document.getElementById('side-panel');
document.getElementById('toggle-panel').addEventListener('click', () => sidePanel.classList.add('open'));
document.getElementById('btn-close-panel').addEventListener('click', () => sidePanel.classList.remove('open'));

function updateEntityList() {
  const listEl = document.getElementById('entity-list');
  if (entities.length === 0) {
    listEl.innerHTML = '<div style="color:var(--ink-dim); font-size:11px; padding:8px 0;">Nenhum elemento no território.</div>';
    return;
  }
  let html = '';
  entities.forEach((ent, idx) => {
    const def = TYPES[ent.type];
    html += `
      <div class="list-item">
        <span><b>${def.label}</b> (${ent.gx}, ${ent.gy})</span>
        <button onclick="removeEntityIndex(${idx})">remover</button>
      </div>`;
  });
  listEl.innerHTML = html;
}

window.removeEntityIndex = function(idx) {
  entities.splice(idx, 1);
  updateEntityList();
  showToast('Entidade removida.');
};

document.getElementById('btn-clear').addEventListener('click', () => {
  if (confirm('Deseja limpar todo o território?')) {
    entities = [];
    updateEntityList();
    showToast('Território limpo.');
  }
});

// ------------------------------------------------------------
// PERSISTÊNCIA JSON
// ------------------------------------------------------------
document.getElementById('btn-export').addEventListener('click', () => {
  const data = {
    version: '1.0',
    timestamp: new Date().toISOString(),
    entities: entities
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'territorio_planta.json';
  a.click();
  showToast('JSON exportado com sucesso!');
});

document.getElementById('btn-import').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = event => {
      try {
        const data = JSON.parse(event.target.result);
        if (data.entities && Array.isArray(data.entities)) {
          entities = data.entities;
          updateEntityList();
          showToast('JSON carregado com sucesso!');
        } else {
          showToast('Formato JSON inválido.');
        }
      } catch (err) {
        showToast('Erro ao processar arquivo.');
      }
    };
    reader.readAsText(file);
  };
  input.click();
});

updateEntityList();
</script>
</body>
</html>
