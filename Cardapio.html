<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Vetorelli - Cardápio Experience</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="Cardapio.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="header-content">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgIVywerTEx7Qorio908b4OTVv3x2yo2lPl38CVdhCxtJOK23tK_pRTy8-hcSIWtNLZ6ifuzf8WhXOmFqBkr2aOqR78JmGc_Wc5uRLHtLUAYenxGd26uMjEg5E0bMKp03cqXDwXuJ7yA_0LXYoUxIn6ye7Vn6Q5CnTv-oPnLAMz58zVaijoADv3cRQM5T3L/s1600/20250614_012036.png" alt="Logo">
            <h1>VETORELLI</h1>
            <p class="tagline">A melhor pizza da região</p>
        </div>
    </header>

    <nav class="main-nav">
        <button onclick="selecionar('pizza')" class="btn-nav">PIZZAS</button>
        <button onclick="selecionar('broto')" class="btn-nav">BROTOS</button>
        <button onclick="selecionar('calzone')" class="btn-nav">CALZONES</button>
        <button onclick="selecionar('bebidas')" class="btn-nav">BEBIDAS</button>
    </nav>

    <div class="subnav" id="subnav" style="display:none;">
        <button onclick="mostrar('inteira')">TAMANHO INTEIRO</button>
        <button onclick="mostrar('meia')">MEIA-MEIA (2 SABORES)</button>
    </div>

    <main id="sabores" class="categoria-container"></main>

    <div class="brand-section">
        <p>QUALIDADE GARANTIDA</p>
        <div class="carousel-wrapper">
            <div class="carousel-track">
                <img src="https://logodownload.org/wp-content/uploads/2014/10/cocacola-logo-1-1.png" alt="Coca">
                <img src="https://logodownload.org/wp-content/uploads/2020/06/catupiry-logo.png" alt="Catupiry">
                <img src="https://logodownload.org/wp-content/uploads/2014/09/heineken-logo-1.png" alt="Heineken">
                <img src="https://logodownload.org/wp-content/uploads/2014/10/cocacola-logo-1-1.png" alt="Coca">
                <img src="https://logodownload.org/wp-content/uploads/2020/06/catupiry-logo.png" alt="Catupiry">
            </div>
        </div>
    </div>

    <div id="carrinhoToggle" onclick="toggleCarrinho()">
        <div class="cart-pulse"></div>
        <span class="cart-icon">🛒</span>
        <span id="cart-count">0</span>
    </div>

    <section id="carrinho">
        <div class="carrinho-header">
            <h2>SEU PEDIDO</h2>
            <button class="btn-fechar" onclick="toggleCarrinho()">VOLTAR [X]</button>
        </div>
        
        <textarea id="pedido" readonly placeholder="Escolha suas delícias..."></textarea>
        
        <div id="opcoes-entrega" class="entrega-grid">
            <button onclick="mostrarDados('retirar')" class="btn-opcao">VOU RETIRAR</button>
            <button onclick="mostrarDados('delivery')" class="btn-opcao">DELIVERY</button>
        </div>

        <div id="pedidoDetalhes" style="display:none;">
            <div id="entregaCampos" style="display:none;">
                <input type="text" id="endereco" class="input-grande" placeholder="Rua, Número e Bairro">
                <select id="bairro" class="input-grande">
                    <option value="">Selecione o Bairro (Taxa)</option>
                    <option value="Centro">Centro - R$ 3,00</option>
                    <option value="Vila Nova">Vila Nova - R$ 3,00</option>
                    <option value="Morro Branco">Morro Branco - R$ 4,00</option>
                </select>
            </div>

            <select id="pagamento" class="input-grande" onchange="mostrarTroco()">
                <option value="">Forma de Pagamento</option>
                <option value="Cartão">Cartão de Crédito/Débito</option>
                <option value="Pix">Pix</option>
                <option value="Dinheiro">Dinheiro</option>
            </select>

            <div id="trocoArea" style="display:none;">
                <input type="number" id="valorTroco" class="input-grande" placeholder="Troco para quanto?">
            </div>

            <button id="enviar" onclick="enviarPedido()">ENVIAR PARA WHATSAPP</button>
        </div>
    </section>

    <div id="custom-alert-overlay" class="alert-overlay">
        <div class="alert-box">
            <div class="alert-icon">🍕</div>
            <h3 id="custom-alert-title">AVISO</h3>
            <p id="custom-alert-message">Mensagem aqui...</p>
            <button onclick="hideCustomAlert()" class="btn-alert">OK, ENTENDI!</button>
        </div>
    </div>

    <script src="Cardapio.js"></script>
</body>
</html>
