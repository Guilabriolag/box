<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Aquário do Bebê 🐟</title>
<style>
:root{
 --sky1:#bdeaff; --sky2:#eaf9ff; --water1:#8fe3ff; --water2:#4fc3e8;
 --sand:#ffe9b3; --ink:#3a3358; --pink:#ff9ecf; --leaf:#7fd88f;
 --sun:#ffd76b; --card:rgba(255,255,255,.82);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--sky1);font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;overflow:hidden;color:var(--ink)}
#app{position:relative;height:100dvh;width:100%;max-width:520px;margin:auto;overflow:hidden}
svg{width:100%;height:100%;display:block;touch-action:none}

.topbar{position:absolute;top:14px;left:14px;right:14px;z-index:10;display:flex;justify-content:space-between;align-items:center}
.pill{background:var(--card);backdrop-filter:blur(6px);border-radius:999px;padding:8px 16px;font-weight:700;
 font-size:14px;box-shadow:0 4px 14px rgba(58,51,88,.15);display:flex;align-items:center;gap:6px}
.roundbtn{width:46px;height:46px;border-radius:50%;border:none;background:var(--card);font-size:20px;
 box-shadow:0 4px 14px rgba(58,51,88,.15)}

.bottombar{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:16px 18px calc(18px + env(safe-area-inset-bottom));
 display:flex;justify-content:center;gap:22px}
.bigbtn{width:92px;height:92px;border-radius:32px;border:none;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:4px;font-family:inherit;font-weight:800;font-size:13px;
 color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.12), 0 10px 20px rgba(58,51,88,.25);transition:transform .08s}
.bigbtn:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.12), 0 4px 10px rgba(58,51,88,.2)}
.bigbtn span{font-size:34px}
#btnFeed{background:linear-gradient(160deg,#ffb877,#ff8f5a)}
#btnPet{background:linear-gradient(160deg,#ff9ecf,#ff6fb0)}

.meter{position:absolute;top:70px;left:14px;z-index:10;display:flex;flex-direction:column;gap:8px}
.mrow{background:var(--card);backdrop-filter:blur(6px);border-radius:16px;padding:6px 12px;display:flex;
 align-items:center;gap:8px;font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(58,51,88,.12)}
.mrow .track{width:70px;height:10px;border-radius:8px;background:#fff;overflow:hidden}
.mrow .fill{height:100%;border-radius:8px;transition:width .5s}

.pickcard{position:absolute;left:50%;bottom:128px;transform:translateX(-50%);z-index:9;
 background:var(--card);backdrop-filter:blur(8px);border-radius:22px;padding:10px 18px;text-align:center;
 font-size:12px;font-weight:700;opacity:0;transition:opacity .3s,transform .3s;box-shadow:0 6px 18px rgba(58,51,88,.15)}
.pickcard.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.sparkle-emoji{position:absolute;pointer-events:none;font-size:22px;z-index:15;animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.6)}30%{transform:translateY(-20px) scale(1.15)}100%{opacity:0;transform:translateY(-90px) scale(1)}}
</style>
</head>
<body>
<div id="app">
 <svg id="svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <defs>
   <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#bdeaff"/><stop offset="38%" stop-color="#eaf9ff"/>
   </linearGradient>
   <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8fe3ff"/><stop offset="100%" stop-color="#2f9fd6"/>
   </linearGradient>
   <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fff6d6"/><stop offset="100%" stop-color="#ffd76b"/>
   </radialGradient>
   <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect x="0" y="0" width="400" height="330" fill="url(#skyGrad)"/>
  <circle cx="320" cy="90" r="46" fill="url(#sunGrad)"/>
  <g id="clouds"></g>
  <rect x="0" y="300" width="400" height="500" fill="url(#waterGrad)"/>
  <path d="M0 300 Q100 280 200 300 T400 300 V320 H0 Z" fill="#eaf9ff" opacity=".6"/>

  <g id="sandbed"><rect x="0" y="760" width="400" height="40" fill="#ffe9b3"/></g>
  <g id="weeds"></g>
  <g id="bubbles"></g>
  <g id="fish"></g>
  <g id="fx"></g>
 </svg>

 <div class="topbar">
  <div class="pill">⭐ <span id="joyCount">0</span></div>
  <button class="roundbtn" id="btnMute">🔊</button>
 </div>

 <div class="meter">
  <div class="mrow">🍎 <div class="track"><div class="fill" id="fFood" style="background:#ff9f5a;width:70%"></div></div></div>
  <div class="mrow">💗 <div class="track"><div class="fill" id="fLove" style="background:#ff6fb0;width:70%"></div></div></div>
</div>

 <div class="pickcard" id="pickcard">toque ou arraste um peixinho!</div>

 <div class="bottombar">
  <button class="bigbtn" id="btnFeed"><span>🍎</span>alimentar</button>
  <button class="bigbtn" id="btnPet"><span>💗</span>carinho</button>
 </div>
</div>

<script>
const ns="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
const svg=$("svg"), fishLayer=$("fish"), fxLayer=$("fx");

/* ===================== nuvens / bolhas / algas (decoração) ===================== */
function el(tag,attrs){const e=document.createElementNS(ns,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e}

const clouds=$("clouds");
for(let i=0;i<4;i++){
 const c=el("ellipse",{cx:40+i*110,cy:50+Math.random()*40,rx:34,ry:16,fill:"#fff",opacity:.85});
 clouds.appendChild(c); c.dataset.speed=(0.08+Math.random()*0.1).toFixed(3); c.dataset.x=40+i*110;
}

const weeds=$("weeds");
const weedX=[30,80,140,260,320,370];
weedX.forEach((x,i)=>{
 const p=el("path",{d:"",fill:"none",stroke:"#4fae5c","stroke-width":10,"stroke-linecap":"round"});
 p.dataset.x=x; p.dataset.h=60+ (i%3)*24; p.dataset.i=i;
 weeds.appendChild(p);
});

const bubbles=$("bubbles");
const bubbleData=[];
for(let i=0;i<16;i++){
 const r=2+Math.random()*4;
 const c=el("circle",{cx:Math.random()*400,cy:320+Math.random()*460,r,fill:"#fff",opacity:.35});
 bubbles.appendChild(c);
 bubbleData.push({el:c,x:+c.getAttribute("cx"),y:+c.getAttribute("cy"),sp:0.3+Math.random()*0.6,drift:Math.random()*2,phase:Math.random()*10});
}

/* ===================== peixinhos ===================== */
const FISH_DEFS=[
 {color:"#ff9ecf", size:1.05},
 {color:"#ffd76b", size:0.9},
 {color:"#7fd8ff", size:1.0},
];

function buildFish(def, i){
 const g=el("g",{class:"fishg"});
 const s=def.size;
 const body=el("ellipse",{cx:0,cy:0,rx:34*s,ry:22*s,fill:def.color});
 const tail=el("path",{d:`M${-32*s} 0 L${-52*s} ${-16*s} L${-52*s} ${16*s} Z`,fill:def.color});
 const eye=el("circle",{cx:14*s,cy:-4*s,r:5*s,fill:"#3a3358"});
 const eyeShine=el("circle",{cx:16*s,cy:-6*s,r:1.6*s,fill:"#fff"});
 const cheek=el("circle",{cx:2*s,cy:8*s,r:7*s,fill:"#ff8fae",opacity:.55});
 const finTop=el("path",{d:`M${-4*s} ${-20*s} Q0 ${-34*s} ${10*s} ${-18*s} Z`,fill:def.color,opacity:.9});
 g.append(tail,body,finTop,cheek,eye,eyeShine);
 fishLayer.appendChild(g);
 return g;
}

const fish=FISH_DEFS.map((def,i)=>{
 const gx = 90+i*110, gy = 420+ i*70;
 const el2 = buildFish(def,i);
 return {
  el:el2, color:def.color, size:def.size,
  pos:{x:gx,y:gy}, target:{x:gx,y:gy}, timer:1+Math.random()*2,
  speed:26+Math.random()*18, dragging:false, pointerId:null,
  spring:{x:0,y:0,vx:0,vy:0,tx:0,ty:0}
 };
});

const STIFF=90, DAMP=9, MAXPULL=46;

/* ===================== som (Web Audio, sem arquivos externos) ===================== */
let actx=null, muted=false, musicOn=false;
function ensureAudio(){ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==="suspended") actx.resume(); }

function blip(freq=520, dur=.14, type="sine", vol=.18){
 if(muted) return;
 ensureAudio();
 const t0=actx.currentTime;
 const o=actx.createOscillator(), g=actx.createGain();
 o.type=type; o.frequency.setValueAtTime(freq,t0);
 o.frequency.exponentialRampToValueAtTime(Math.max(60,freq*0.7), t0+dur);
 g.gain.setValueAtTime(0.0001,t0);
 g.gain.exponentialRampToValueAtTime(vol,t0+0.02);
 g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
 o.connect(g); g.connect(actx.destination);
 o.start(t0); o.stop(t0+dur+0.02);
}
function chord(freqs, dur=.5, vol=.10){
 if(muted) return; ensureAudio();
 freqs.forEach(f=>blip(f,dur,"sine",vol));
}

// melodia de ninar simples, em loop, pentatônica (agradável e nada estressante)
const MELODY=[523,587,659,784,880,784,659,587, 523,659,784,880,987,880,784,659];
let melodyIdx=0, melodyTimer=null;
function scheduleMelody(){
 if(!musicOn||muted){ melodyTimer=setTimeout(scheduleMelody,400); return; }
 ensureAudio();
 const note=MELODY[melodyIdx%MELODY.length]; melodyIdx++;
 blip(note,0.5,"sine",0.05);
 melodyTimer=setTimeout(scheduleMelody,430);
}

$("btnMute").addEventListener("click",()=>{
 muted=!muted;
 $("btnMute").textContent = muted?"🔇":"🔊";
 if(!muted){ ensureAudio(); if(!musicOn){musicOn=true; scheduleMelody();} }
});

/* ===================== medidores (sem "castigo": só acumulam carinho) ===================== */
let food=70, love=70, joy=0;
function clamp(v){return Math.max(0,Math.min(100,v))}
function paintMeters(){ fFood.style.width=food+"%"; fLove.style.width=love+"%"; }
function addJoy(n=1){ joy+=n; joyCount.textContent=joy; }

function sparkleAt(x,y,emoji){
 const rect=svg.getBoundingClientRect();
 const px = rect.left + (x/400)*rect.width;
 const py = rect.top + (y/800)*rect.height;
 const span=document.createElement("div");
 span.className="sparkle-emoji"; span.textContent=emoji;
 span.style.left=(px-11)+"px"; span.style.top=(py-11)+"px";
 document.body.appendChild(span);
 setTimeout(()=>span.remove(),1150);
}

function showPick(msg){
 const p=$("pickcard"); p.textContent=msg; p.classList.add("show");
 clearTimeout(showPick._t); showPick._t=setTimeout(()=>p.classList.remove("show"),1600);
}

/* ===================== ações grandes ===================== */
$("btnFeed").addEventListener("click",()=>{
 food=clamp(food+18); paintMeters(); addJoy(1);
 blip(700,.12,"triangle",.16); setTimeout(()=>blip(500,.12,"triangle",.14),90);
 const f=fish[Math.floor(Math.random()*fish.length)];
 sparkleAt(f.pos.x,f.pos.y-20,"🍎"); showPick("nham nham!");
});
$("btnPet").addEventListener("click",()=>{
 love=clamp(love+18); paintMeters(); addJoy(1);
 blip(880,.16,"sine",.14);
 const f=fish[Math.floor(Math.random()*fish.length)];
 sparkleAt(f.pos.x,f.pos.y-20,"💗"); showPick("ele adorou o carinho!");
});
paintMeters();

/* ===================== interação por toque/arraste nos peixes ===================== */
function svgPoint(evt){
 const pt=svg.createSVGPoint(); pt.x=evt.clientX; pt.y=evt.clientY;
 const m=svg.getScreenCTM().inverse(); return pt.matrixTransform(m);
}
function fishAt(p){
 let best=null,bd=1e9;
 fish.forEach(f=>{ const d=Math.hypot(p.x-f.pos.x,p.y-f.pos.y); if(d<50 && d<bd){bd=d;best=f} });
 return best;
}
svg.addEventListener("pointerdown",e=>{
 ensureAudio();
 if(!musicOn){ musicOn=true; scheduleMelody(); }
 const p=svgPoint(e); const f=fishAt(p);
 if(f){
  f.dragging=true; f.pointerId=e.pointerId; svg.setPointerCapture(e.pointerId);
  blip(700+Math.random()*260,.12,"sine",.16);
  addJoy(1); sparkleAt(f.pos.x,f.pos.y-24,"✨"); showPick("hihi, gostoso!");
 }
});
svg.addEventListener("pointermove",e=>{
 const f=fish.find(x=>x.dragging && x.pointerId===e.pointerId);
 if(!f) return;
 const p=svgPoint(e); let dx=p.x-f.pos.x, dy=p.y-f.pos.y; const m=Math.hypot(dx,dy);
 if(m>MAXPULL){dx=dx/m*MAXPULL; dy=dy/m*MAXPULL}
 f.spring.tx=dx; f.spring.ty=dy;
});
function releaseFish(e){
 const f=fish.find(x=>x.dragging && x.pointerId===e.pointerId);
 if(!f) return;
 f.dragging=false; f.pointerId=null; f.timer=0.2;
}
svg.addEventListener("pointerup",releaseFish);
svg.addEventListener("pointercancel",releaseFish);

/* ===================== loop de animação ===================== */
let lastT=performance.now();
function loop(now){
 const dt=Math.min(0.05,(now-lastT)/1000); lastT=now; const t=now/1000;

 // nuvens
 clouds.querySelectorAll("ellipse").forEach(c=>{
  let x=+c.dataset.x + t*(+c.dataset.speed);
  if(x>440) x=-40;
  c.dataset.x=x; c.setAttribute("cx",x);
 });

 // algas balançando
 weeds.querySelectorAll("path").forEach(p=>{
  const x=+p.dataset.x, h=+p.dataset.h, i=+p.dataset.i, sway=Math.sin(t*1.1+i)*12;
  p.setAttribute("d",`M${x} 800 Q${x-14+sway} ${800-h*.5} ${x+sway*.5} ${800-h}`);
 });

 // bolhas subindo
 bubbleData.forEach(b=>{
  b.y-=b.sp; b.x+=Math.sin(t*0.8+b.phase)*b.drift*0.3;
  if(b.y<300){ b.y=790; b.x=Math.random()*400; }
  b.el.setAttribute("cx",b.x); b.el.setAttribute("cy",b.y);
 });

 // peixinhos: nado + mola de arrastar
 fish.forEach(f=>{
  if(!f.dragging){
   f.timer-=dt;
   const d=Math.hypot(f.target.x-f.pos.x, f.target.y-f.pos.y);
   if(d<10||f.timer<=0){
    f.target={x:50+Math.random()*300, y:360+Math.random()*380};
    f.timer=2+Math.random()*3;
   }
   const dx=f.target.x-f.pos.x, dy=f.target.y-f.pos.y, dist=Math.hypot(dx,dy)||1;
   const step=Math.min(dist,f.speed*dt);
   f.pos.x+=dx/dist*step; f.pos.y+=dy/dist*step;
   f.facing = dx<0 ? -1 : 1;
  }
  const tx=f.dragging?f.spring.tx:0, ty=f.dragging?f.spring.ty:0;
  f.spring.vx+=((tx-f.spring.x)*STIFF - f.spring.vx*DAMP)*dt;
  f.spring.vy+=((ty-f.spring.y)*STIFF - f.spring.vy*DAMP)*dt;
  f.spring.x+=f.spring.vx*dt; f.spring.y+=f.spring.vy*dt;

  const bob=Math.sin(t*2.4+f.pos.x*0.02)*4;
  const px=f.pos.x+f.spring.x, py=f.pos.y+f.spring.y+bob;
  const scaleX = (f.facing<0? -1:1);
  f.el.setAttribute("transform",`translate(${px} ${py}) scale(${scaleX*f.size} ${f.size}) rotate(${f.spring.y*0.6})`);
 });

 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// tira o card de dica depois de um tempinho
setTimeout(()=>{ if(!$("pickcard").classList.contains("show")) showPick("toque ou arraste um peixinho!"); },1200);
</script>
</body>
</html>
